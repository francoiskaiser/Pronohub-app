function exportData() {
  Store.flush();
  const data = {};
  for (const k of Store.keys()) if (!/^(mo|fx)\./.test(k)) data[k] = Store.get(k);
  download(`pronohub-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "pronohub", v: APP_VERSION, at: now(), data }, null, 1));
  toast("Data exported");
}

function importData(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const j = JSON.parse(r.result);
      if (j.app !== "pronohub" || !j.data) throw 0;
      if (!(await ask("Import this file? Your profile and circles on this device will be replaced.", "Import"))) return;
      for (const [k, v] of Object.entries(j.data)) Store.set(k, v);
      toast("Import complete", "good");
      setTimeout(() => location.reload(), 600);
    } catch (e) { toast("This file isn't a Pronohub backup", "bad"); }
  };
  r.readAsText(file);
}

async function sendFeedback(fd) {
  const d = { type: fd.get("type"), msg: String(fd.get("msg") || "").slice(0, 2000), email: String(fd.get("email") || "").slice(0, 200), app: "pronohub", v: APP_VERSION, lang: LANG, at: now(), ua: navigator.userAgent.slice(0, 200) };
  if (!FB.ok) { copyText(`[Pronohub ${APP_VERSION}] ${d.type} : ${d.msg}`); S.modal = null; render(); return; }
  try {
    d.uid = FB.uid;
    await FB.db.collection("feedback").add(d);
    S.modal = { k: "feedback", sent: true };
  } catch (e) { toast(fbErr(e), "bad"); }
  render();
}

function settingsAct(a, d) {
  switch (a) {
    case "settings": go("settings"); return true;
    case "pref": Prefs.set({ [d.k]: d.v }); return true;
    case "lang": setLang(d.v); return true;
    case "export": exportData(); return true;
    case "feedback": S.modal = { k: "feedback" }; return true;
    case "legal": S.modal = { k: "legal" }; return true;
    case "tour": S.modal = { k: "tour", step: 0 }; return true;
  }
  return false;
}

/* ---------- Actions ---------- */

async function openCircle(code) {
  if (S.pendingMatch && !S.pendingMatch.code) S.pendingMatch.code = code;
  S.code = code;
  S.view = "circle";
  S.tab = "bets";
  S.modal = null;
  S.actor = null;
  Store.set("last", code);
  DB.open(code);
  render();
}

async function newSeason() {
  const cc = DB.cur(), a = analysis(cc), c = cc.circle;
  const open = Object.values(a.bets).filter(x => x.state === "open" || x.state === "closed").length;
  if (!(await ask(`Start season ${c.season + 1} ?${open ? ` ${open} bet(s) still open will be cancelled and refunded.` : ""}`, "Start season"))) return;
  const standings = a.standings.map(s => ({ uid: s.uid, name: s.name, avatar: s.avatar || "", bal: s.bal }));
  for (const x of Object.values(a.bets)) if (x.state === "open" || x.state === "closed") await DB.put("bets", x.id, { status: "void", settledAt: now(), settledBy: myId(cc) }, true);
  await DB.putSeason(c.season, { n: c.season, endedAt: now(), standings });
  await DB.setCircle({ season: c.season + 1, seasonAt: now() });
  S.modal = null;
  S.tab = "rank";
  toast(`Season ${c.season + 1} is on: good luck everyone!`, "good");
  render();
}

function circlesAct(a, d) {
  const cc = DB.cur();
  switch (a) {
    case "home": DB.close(); S.code = null; S.view = "home"; S.modal = null; Store.del("last"); return true;
    case "openCircle": openCircle(d.code); return true;
    case "newCircle": S.modal = { k: "newCircle" }; return true;
    case "joinCircle": S.modal = { k: "join" }; return true;
    case "switcher": S.modal = { k: "switcher" }; return true;
    case "invite": S.modal = { k: "invite" }; return true;
    case "circleInfo": S.modal = { k: "circle" }; return true;
    case "recover": S.modal = { k: "recover" }; return true;
    case "actor": S.modal = { k: "actor" }; return true;
    case "setActor": S.actor = d.uid; S.modal = null; toast(LANG === "en" ? memberOf(cc, d.uid).name + "'s turn" : "À " + memberOf(cc, d.uid).name + " de jouer"); return true;
    case "retry": { const c = S.code; DB.close(); DB.open(c); return true; }
    case "forgetCircle": MyCircles.remove(d.code); Account.syncCircles(); circlesAct("home", {}); return true;
    case "rejoin": S.modal = { k: "join", code: d.code }; return true;
    case "share": navigator.share({ title: "Pronohub", text: "Join my betting circle on Pronohub", url: d.url }).catch(() => { }); return true;
    case "copy": copyText(d.text); return true;
    case "showKey":
      FB.sub(cc.code, "private").doc("owner").get().then(s => { S.modal.key = s.exists ? s.data().key : "?"; render(); }).catch(e => toast(fbErr(e), "bad"));
      return true;
    case "newSeason": newSeason(); return true;
    case "giveOwner":
      ask(`Hand over to ${memberOf(cc, d.uid).name} ? You will no longer be able to change the circle's rules.`, "Hand over")
        .then(ok => ok && DB.setCircle({ owner: d.uid }).then(ok => ok && toast("Done")));
      return true;
    case "kick":
      ask(`Remove ${memberOf(cc, d.uid).name} from the circle?`, "Remove", true).then(ok => ok && DB.del("members", d.uid));
      return true;
    case "leave":
      ask("Leave this circle? You can come back with the code.", "Leave the circle", true).then(ok => ok && DB.del("members", myId(cc))).then(ok => {
        if (!ok) return;
        MyCircles.remove(cc.code); Account.syncCircles(); circlesAct("home", {}); render();
      });
      return true;
    case "deleteLocal":
      ask("Permanently delete this circle and all its bets?", "Delete the circle", true).then(ok => {
        if (!ok) return;
        Store.del("local." + cc.code); MyCircles.remove(cc.code); circlesAct("home", {}); render();
      });
      return true;
  }
  return false;
}

function circlesSubmit(f, fd) {
  const k = f.dataset.f;
  const num = (n, def) => Math.max(0, Math.min(100000, parseInt(fd.get(n), 10) || def || 0));
  if (k === "profile") {
    const name = String(fd.get("name") || "").trim().slice(0, 24);
    if (!name) return true;
    Profile.set({ name, avatar: fd.get("avatar") || "" });
    Account.pushProfile();
    if (S.pendingJoin && FB.ok) { S.modal = { k: "join", code: S.pendingJoin }; S.pendingJoin = null; }
    else if (!Store.get("tourDone")) { S.modal = { k: "tour", step: 0 }; Store.set("tourDone", 1); }
    render();
    return true;
  }
  if (k === "newCircle") {
    const name = String(fd.get("name") || "").trim().slice(0, 32);
    const emoji = fd.get("emoji") || "🎯";
    const st = { start: Math.max(100, num("start", 1000)), daily: num("daily"), rescue: num("rescue"), bonus: num("bonus"), seed: CIRCLE_DEFAULTS.seed };
    const local = fd.get("where") !== "online" || !FB.ok;
    (local ? DB.createLocal(name, emoji, st) : DB.createOnline(name, emoji, st))
      .then(code => { openCircle(code); S.modal = { k: local ? "circle" : "invite" }; toast("Circle created", "good"); render(); })
      .catch(e => toast(fbErr(e), "bad"));
    return true;
  }
  if (k === "join") {
    const code = normCode(fd.get("code"));
    if (!code) { S.modal.err = "The code has 6 characters, for example ABC-234."; render(); return true; }
    S.modal.busy = true; S.modal.code = code; render();
    DB.join(code).then(() => { toast("Welcome to the circle!", "good"); openCircle(code); })
      .catch(e => { S.modal.busy = false; S.modal.err = e.code === "not-found" ? "No circle with this code. Check the letters and digits." : fbErr(e); render(); });
    return true;
  }
  if (k === "circleEdit") {
    DB.setCircle({ name: String(fd.get("name")).trim().slice(0, 32), emoji: fd.get("emoji") || "🎯", daily: num("daily"), rescue: num("rescue"), bonus: num("bonus"), seed: num("seed") })
      .then(ok => { if (ok) { toast("Rules saved", "good"); Account.syncCircles(); } });
    return true;
  }
  if (k === "addPlayer") {
    const name = String(fd.get("name") || "").trim().slice(0, 24);
    if (!name) return true;
    const id = "p_" + rid(6);
    DB.put("members", id, { uid: id, name, avatar: AVATARS[hashStr(id) % AVATARS.length], joinedAt: now() });
    toast(name + " joins the circle");
    return true;
  }
  if (k === "recover") {
    const key = String(fd.get("key") || "").trim().toUpperCase();
    const cc = DB.cur();
    FB.circle(cc.code).set({ owner: FB.uid, proof: key }, { merge: true })
      .then(async () => {
        const nk = rid(10).toUpperCase();
        await FB.sub(cc.code, "private").doc("owner").set({ key: nk });
        await FB.circle(cc.code).update({ proof: firebase.firestore.FieldValue.delete() });
        S.modal = { k: "circle", key: nk };
        toast("You're back in control. New key generated.", "good");
        render();
      })
      .catch(() => { S.modal.err = "Wrong key."; render(); });
    return true;
  }
  return false;
}

/* ===== bets.js ===== */
/* Pronohub — paris : liste, détail, création, mises, résultats, contestations, duels */

const STATE_LABEL = { open: "Open", closed: "Awaiting result", settled: "Finished", void: "Cancelled", contested: "Disputed" };

function canManage(cc, b, uid = myId(cc)) { return b.createdBy === uid || isOwner(cc, uid); }
function myWager(info, uid) { return info.ws.find(w => w.u === uid); }

/* ---------- Bandeau bonus du jour / renflouement ---------- */
function bonusCard(cc, a) {
  const me = myId(cc), p = a.players[me];
  if (!p) return "";
  const day = dayNum();
  const c = cc.circle;
  const out = [];
  if (c.rescue > 0 && p.bal < 10 && !cc.ledger[`${me}_rescue_${day}`]) {
    out.push(`<div class="gift broke"><span class="gift-coin" aria-hidden="true">💸</span><span class="grow"><b>Broke?</b><small>The bank bails you out with ${nf(c.rescue)} tokens. It'll count as a bankruptcy…</small></span><button class="btn small" data-a="claimRescue">Bail me out</button></div>`);
  }
  return out.join("");
}

/* ---------- Ticket (carte de pari) ---------- */
function ticket(cc, a, info) {
  const b = info.b, me = myId(cc), mine = myWager(info, me);
  const cat = CAT[b.cat] || CAT.autre;
  const L = b.src && LEAGUE[b.src.league];
  let time;
  if (info.state === "open") time = `<span class="t-time live">${ICON.clock}${countdown(b.closesAt)}</span>`;
  else time = `<span class="t-time">${STATE_LABEL[info.state]}</span>`;
  const maxShare = Math.max(1, ...b.options.map(o => info.byOpt[o.id] || 0));
  const optsArr = b.options.map(o => {
    const win = info.state === "settled" && b.result === o.id;
    const hide = info.state === "open" && b.kind !== "duel";
    return `<div class="t-opt ${mine && mine.opt === o.id ? "mine" : ""} ${win ? "win" : ""}">
      <span class="t-lbl">${esc(o.label)}</span>
      <span class="t-odd">${info.odds[o.id] ? oddsFmt(info.odds[o.id]) : "—"}</span>
      <i class="t-bar" style="--w:${hide ? 0 : Math.round(100 * (info.byOpt[o.id] || 0) / maxShare)}%"></i>
    </div>`;
  });
  const opts = optsArr.length <= 4 ? optsArr.join("") : optsArr.slice(0, 3).join("") + `<div class="t-more">+ ${optsArr.length - 3} ${pl(optsArr.length - 3, "other choice", "other choices")}</div>`;
  let stamp = "";
  if (mine && info.state === "settled") {
    const g = info.payouts[mine.id] - mine.amt;
    stamp = g > 0 ? `<span class="stamp win">Won +${nf(g)}</span>` : g === 0 ? `<span class="stamp void">Refunded</span>` : `<span class="stamp lose">Lost</span>`;
  } else if (info.state === "void") stamp = `<span class="stamp void">Cancelled</span>`;
  else if (info.state === "contested") stamp = `<span class="stamp lose">Disputed</span>`;
  const title = b.kind === "match" && b.home ? matchTitle(b) : esc(b.title);
  const duelLine = b.kind === "duel" && b.duel ? `<p class="t-sub">${esc(memberOf(cc, b.createdBy).name)} vs ${esc(memberOf(cc, b.duel.to).name)}, ${nf(b.duel.stake)} tokens each</p>` : "";
  return `<article class="ticket st-${info.state} ${mine ? "has-mine" : ""}">
    <div class="t-top"><span class="t-cat">${cat.e} ${L ? esc(L.name) : esc(cat.label)}</span>${time}</div>
    <h3 class="t-title">${title}</h3>
    ${duelLine}
    <div class="t-opts n${Math.min(b.options.length, 4)}">${opts}</div>
    <div class="t-foot">
      <span>${ICON.coin}${nf(info.pool)}</span>
      <span>${info.participants.size} ${pl(info.participants.size, "bettor", "bettors")}</span>
      ${mine ? `<span class="t-mine">Your stake: ${nf(mine.amt)}</span>` : info.state === "open" ? `<span class="t-cta">Bet</span>` : ""}
    </div>
    ${stamp}
    <button class="t-link" data-a="openBet" data-id="${esc(info.id)}" aria-label="Voir le pari : ${esc(b.kind === "match" && b.home ? b.home + " – " + b.away : b.title)}"></button>
  </article>`;
}

function matchTitle(b) {
  const logo = (u, n) => u ? `<img src="${esc(u)}" alt="" loading="lazy" width="22" height="22" onerror="this.remove()">` : `<span class="crest" aria-hidden="true">${esc(n.charAt(0))}</span>`;
  return `<span class="match"><span class="team">${logo(b.homeLogo, b.home)}${esc(b.home)}</span><span class="vs">${b.score ? `${b.score.h}–${b.score.a}` : "–"}</span><span class="team away">${esc(b.away)}${logo(b.awayLogo, b.away)}</span></span>`;
}

/* ---------- Onglet Paris ---------- */
function betsTab(cc, a) {
  const all = Object.values(a.bets);
  const groups = {
    open: all.filter(x => x.state === "open").sort((x, y) => x.b.closesAt - y.b.closesAt),
    todo: all.filter(x => x.state === "closed" || x.state === "contested").sort((x, y) => x.b.closesAt - y.b.closesAt),
    done: all.filter(x => x.state === "settled" || x.state === "void").sort((x, y) => (y.b.settledAt || 0) - (x.b.settledAt || 0)),
  };
  const f = S.filter in groups ? S.filter : "open";
  const list = groups[f];
  const seg = (k, l) => `<button class="seg ${f === k ? "on" : ""}" data-a="filter" data-v="${k}" aria-pressed="${f === k}">${l}<span class="count">${groups[k].length}</span></button>`;
  const empty = {
    open: `<div class="empty"><p class="empty-big">No open bets.</p><p>Start the first one: a match, an election or a question for the coffee break.</p><button class="btn primary" data-a="newBet">${ICON.plus} Create a bet</button></div>`,
    todo: `<div class="empty"><p class="empty-big">Nothing to settle.</p><p>Closed bets awaiting a result will show up here.</p></div>`,
    done: `<div class="empty"><p class="empty-big">No results yet.</p><p>Finished bets and your winnings will show up here.</p></div>`,
  }[f];
  return `<section class="page">
    ${bonusCard(cc, a)}
    <div class="segs tabs-filter" role="group" aria-label="Filter bets">${seg("open", "Open")}${seg("todo", "To settle")}${seg("done", "Finished")}</div>
    ${f === "open" ? `<div class="sec-head"><h2>Upcoming matches</h2><button class="btn small ghost" data-a="newBet">${ICON.plus} Other bet</button></div>${matchStrip(cc)}<div class="sec-head"><h2>Open bets</h2></div>` : ""}
    <div class="tickets">${list.length ? list.map(x => ticket(cc, a, x)).join("") : empty}</div>
  </section>`;
}

/* ---------- Détail d'un pari ---------- */
function betView(cc, a) {
  const info = a.bets[S.betId];
  if (!info) return `<section class="page"><div class="pagehead"><button class="icon-btn" data-a="back" aria-label="Back">${ICON.back}</button><h1>Bet not found</h1></div><p class="muted">It may have been deleted, or it belongs to a finished season.</p></section>`;
  const b = info.b, me = myId(cc), mine = myWager(info, me);
  const cat = CAT[b.cat] || CAT.autre;
  const L = b.src && LEAGUE[b.src.league];
  const open = info.state === "open";
  const manage = canManage(cc, b, me);
  const reveal = !open || b.kind === "duel";
  const isDuelTarget = b.kind === "duel" && b.duel && b.duel.to === me;

  const opts = b.options.map(o => {
    const share = info.pool ? (info.byOpt[o.id] || 0) / info.pool : 0;
    const n = info.ws.filter(w => w.opt === o.id).length;
    const win = (info.state === "settled" || info.state === "contested") && b.result === o.id;
    const can = open && b.kind !== "duel" && (!mine || mine.opt === o.id);
    const tag = can ? "button" : "div";
    return `<${tag} class="opt ${mine && mine.opt === o.id ? "mine" : ""} ${win ? "win" : ""} ${can ? "can" : ""}" ${can ? `data-a="wager" data-opt="${esc(o.id)}"` : ""}>
      <span class="opt-main"><b>${esc(o.label)}</b>${reveal ? `<small>${nf(info.byOpt[o.id] || 0)} tokens, ${n} ${pl(n, "bettor", "bettors")}</small>` : ""}</span>
      <span class="opt-odd">${info.odds[o.id] ? oddsFmt(info.odds[o.id]) : "—"}</span>
      ${reveal ? `<i class="opt-bar" style="--w:${Math.round(share * 100)}%"></i>` : ""}
      ${win ? `<span class="opt-check" aria-label="Result">${ICON.check}</span>` : ""}
    </${tag}>`;
  }).join("");

  let banner = "";
  if (info.state === "settled") {
    banner = `<div class="banner good"><b>Result: ${esc(optLabel(b, b.result))}${b.score ? ` (${b.score.h}–${b.score.a})` : ""}</b><small>${b.settledBy === "auto" ? "Settled automatically" : "Settled by " + esc(memberOf(cc, b.settledBy).name)}, ${rel(b.settledAt)}</small></div>`;
  } else if (info.state === "contested") {
    banner = `<div class="banner bad"><b>Result disputed</b><small>Most bettors dispute “ ${esc(optLabel(b, b.result))} ”. Winnings are frozen until it's corrected.</small></div>`;
  } else if (info.state === "void") {
    banner = `<div class="banner"><b>Bet cancelled</b><small>All stakes have been refunded.</small></div>`;
  } else if (info.state === "closed") {
    banner = b.src
      ? `<div class="banner"><b>Betting closed</b><small>The result will arrive automatically after the match.</small></div>`
      : `<div class="banner"><b>Betting closed</b><small>${manage ? "Your turn to enter the result." : "Waiting for the result from " + esc(memberOf(cc, b.createdBy).name) + "."}</small></div>`;
  }

  // Ma position
  let minePanel = "";
  if (mine) {
    const pay = info.payouts[mine.id];
    const gain = pay != null ? pay - mine.amt : null;
    minePanel = `<div class="panel mine-panel">
      <div class="row between"><span>Your stake</span><b>${nf(mine.amt)} on ${esc(optLabel(b, mine.opt))}</b></div>
      ${mine.score ? `<div class="row between"><span>Your score</span><b>${mine.score.h}–${mine.score.a}</b></div>` : ""}
      ${gain != null ? `<div class="row between"><span>Result</span><b class="${gain > 0 ? "pos" : gain < 0 ? "neg" : ""}">${gain > 0 ? "+" : ""}${nf(gain)}</b></div>`
        : `<div class="row between"><span>Payout if it wins (estimate)</span><b class="pos">${nf(potential(info, mine.opt, 0, mine))}</b></div>`}
      ${open && b.kind !== "duel" ? `<button class="btn small" data-a="wager" data-opt="${esc(mine.opt)}">Add tokens</button>` : ""}
    </div>`;
  }

  // Duel : accepter ou refuser
  let duelPanel = "";
  if (b.kind === "duel" && open && b.duel) {
    if (isDuelTarget && !mine) duelPanel = `<div class="panel duel">
      <p><b>${esc(memberOf(cc, b.createdBy).name)}</b> challenges you: ${nf(b.duel.stake)} tokens each, the winner takes ${nf(b.duel.stake * 2)}.</p>
      <div class="row wrap"><button class="btn primary" data-a="duelAccept">Accept the challenge</button><button class="btn ghost" data-a="duelDecline">Decline</button></div></div>`;
    else if (b.createdBy === me && info.ws.length < 2) duelPanel = `<div class="panel duel"><p>Waiting for an answer from <b>${esc(memberOf(cc, b.duel.to).name)}</b>. Without an answer before closing, the duel is cancelled.</p></div>`;
  }

  // Parieurs
  const byU = info.ws.slice().sort((x, y) => y.amt - x.amt);
  const people = byU.length ? `<h3>Bettors</h3><ul class="bettors">${byU.map(w => {
    const m = memberOf(cc, w.u);
    const pay = info.payouts[w.id];
    const g = pay != null ? pay - w.amt : null;
    return `<li>${avatar(m)}<span class="grow">${esc(m.name)}${reveal ? `<small>${esc(optLabel(b, w.opt))}${w.score && !open ? ", " + w.score.h + "–" + w.score.a : ""}</small>` : `<small>placed a bet</small>`}</span>
      <span class="amt">${nf(w.amt)}${g != null && g !== 0 ? `<small class="${g > 0 ? "pos" : "neg"}">${g > 0 ? "+" : ""}${nf(g)}</small>` : ""}</span></li>`;
  }).join("")}</ul>${open && b.kind !== "duel" ? `<p class="hint">Everyone's choices will be revealed when betting closes.</p>` : ""}` : "";

  // Actions de gestion
  const acts = [];
  if (b.src && (info.state === "closed" || info.state === "open") && Date.now() > b.closesAt) acts.push(`<button class="btn" data-a="checkResult">Check the result</button>`);
  if (manage && (info.state === "closed" || info.state === "contested" || (open && !b.src && b.kind !== "duel"))) acts.push(`<button class="btn primary" data-a="settle">${info.state === "contested" ? "Correct the result" : "Enter the result"}</button>`);
  if (manage && b.kind === "duel" && (info.state === "closed" || (open && info.ws.length === 2))) acts.push(`<button class="btn primary" data-a="settle">Pick the winner</button>`);
  if (manage && info.state === "settled") acts.push(`<button class="btn ghost" data-a="settle">Correct the result</button>`);
  if (manage && open) acts.push(`<button class="btn ghost" data-a="closeNow">Close betting</button>`);
  if (manage && info.state !== "void" && info.state !== "settled") acts.push(`<button class="btn ghost danger" data-a="voidBet">Cancel the bet</button>`);
  if (manage && !info.ws.some(w => w.u !== me)) acts.push(`<button class="btn ghost danger" data-a="deleteBet">Delete</button>`);

  // Contestation
  let contest = "";
  if ((info.state === "settled" || info.state === "contested") && mine && b.settledBy !== me && a.U(b.settledBy) !== me) {
    const flagged = !!cc.flags[`${info.id}_${me}`] && cc.flags[`${info.id}_${me}`].result === b.result;
    contest = `<div class="contest"><span>${flagged ? "You dispute this result." : "Does the result look wrong?"} <small>${info.contest}/${info.contestNeed} ${pl(info.contestNeed, "vote needed", "votes needed")}</small></span>
      <button class="btn small ${flagged ? "" : "ghost"}" data-a="${flagged ? "unflag" : "flag"}">${flagged ? "Withdraw my dispute" : "Dispute"}</button></div>`;
  }

  return `<section class="page bet-page">
    <div class="pagehead"><button class="icon-btn" data-a="back" aria-label="Back">${ICON.back}</button>
      <span class="t-cat">${cat.e} ${L ? esc(L.name) : esc(cat.label)}</span></div>
    <div class="bet-hero">
      <h1 class="bet-title">${b.kind === "match" && b.home ? matchTitle(b) : esc(b.title)}</h1>
      ${b.desc ? `<p class="bet-desc">${esc(b.desc)}</p>` : ""}
      <p class="bet-meta">${open ? `Closes ${fmtDate(b.closesAt)}, ${rel(b.closesAt)}` : `Closed on ${fmtDate(b.closesAt)}`}</p>
      <p class="bet-meta">Proposed by ${esc(memberOf(cc, b.createdBy).name)}${b.src ? ", automatic result" : ""}${b.bonus ? `, exact score bonus +${nf(b.bonus)}` : ""}</p>
    </div>
    ${banner}
    ${duelPanel}
    <div class="opts">${opts}</div>
    <p class="pool-line">${ICON.coin} <span><b>${nf(info.pool)}</b> tokens in the pot${info.seed ? `, + ${nf(info.seed * b.options.length)} from the bank` : ""}</span></p>
    ${minePanel}
    ${contest}
    ${acts.length ? `<div class="row wrap acts">${acts.join("")}</div>` : ""}
    ${reactionsBar(cc, info.id)}
    ${people}
    ${commentsBlock(cc, info.id)}
    ${b.src ? `<p class="source">Matches and scores: ESPN (unofficial public source).</p>` : ""}
  </section>`;
}

/* ---------- Mise ---------- */
function wagerModal(cc, a) {
  const info = a.bets[S.modal.bet];
  if (!info) return "";
  const b = info.b, me = myId(cc), mine = myWager(info, me);
  const opt = S.modal.opt;
  const bal = a.players[me] ? a.players[me].bal : 0;
  const amt = S.modal.amt != null ? S.modal.amt : Math.min(100, Math.max(0, bal));
  const chips = [10, 50, 100, 250, 500].filter(v => v < bal);
  const scoreOk = b.kind === "match" && b.bonus > 0;
  return `<h2>${mine ? "Add tokens" : "Your stake"}</h2>
    <p class="wager-on">On <b>${esc(optLabel(b, opt))}</b>, current odds ${info.odds[opt] ? oddsFmt(info.odds[opt]) : "—"}</p>
    <form data-f="wager" class="stack">
      <div class="amount">
        <button type="button" class="icon-btn" data-a="amt" data-d="-10" aria-label="Minus 10">−</button>
        <input name="amt" type="number" inputmode="numeric" min="1" max="${bal}" step="1" value="${amt}" aria-label="Amount in tokens" required>
        <button type="button" class="icon-btn" data-a="amt" data-d="10" aria-label="Plus 10">+</button>
      </div>
      <div class="chips">${chips.map(v => `<button type="button" class="chip" data-a="amtSet" data-v="${v}">${v}</button>`).join("")}<button type="button" class="chip hot" data-a="amtSet" data-v="${bal}">All in (${nf(bal)})</button></div>
      <p class="potential">Estimated payout if it wins: <b id="potential">${nf(potential(info, opt, amt, mine))}</b> <small>Final odds depend on everyone's stakes until betting closes.</small></p>
      ${scoreOk && !mine ? `<fieldset class="fld score-fld"><legend>Exact score (optional, +${nf(b.bonus)} if correct)</legend>
        <div class="score"><span>${esc(b.home)}</span><input name="sh" type="number" inputmode="numeric" min="0" max="30" aria-label="Buts ${esc(b.home)}"><span class="dash">–</span><input name="sa" type="number" inputmode="numeric" min="0" max="30" aria-label="Buts ${esc(b.away)}"><span>${esc(b.away)}</span></div>
      </fieldset>` : ""}
      <p class="muted small">Your balance: ${nf(bal)} tokens</p>
      <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn primary big" ${bal < 1 ? "disabled" : ""}>Place bet</button></div>
    </form>`;
}

/* ---------- Résultat ---------- */
function settleModal(cc, a) {
  const info = a.bets[S.modal.bet];
  const b = info.b;
  if (b.kind === "match") {
    return `<h2>Final score</h2>
      <form data-f="settle" class="stack">
        <div class="score big"><span>${esc(b.home)}</span><input name="sh" type="number" inputmode="numeric" min="0" max="99" required aria-label="Score ${esc(b.home)}" value="${b.score ? b.score.h : ""}"><span class="dash">–</span><input name="sa" type="number" inputmode="numeric" min="0" max="99" required aria-label="Score ${esc(b.away)}" value="${b.score ? b.score.a : ""}"><span>${esc(b.away)}</span></div>
        ${b.options.some(o => o.id === "d") ? "" : `<p class="hint">No draw possible: in case of a tie, the bet will be cancelled and refunded.</p>`}
        <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn primary">Confirm the result</button></div>
      </form>`;
  }
  return `<h2>${b.kind === "duel" ? "Who won?" : "What's the result?"}</h2>
    <form data-f="settle" class="stack">
      <div class="choice-list">${b.options.map(o => `<label class="choice"><input type="radio" name="res" value="${esc(o.id)}" required ${b.result === o.id ? "checked" : ""}><span><b>${esc(o.label)}</b></span></label>`).join("")}</div>
      <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn primary">Confirm the result</button></div>
    </form>`;
}

/* ---------- Création ---------- */
function newBetModal(cc) {
  const m = S.modal;
  if (!m.kind) {
    return `<h2>New bet</h2>
      <button class="kind-card feature" data-a="betKind" data-kind="import">
        <span class="k-emo" aria-hidden="true">📡</span><span><b>Import matches</b><small>Football, NBA, NHL, NFL: automatic fixtures and results</small></span></button>
      <div class="kind-grid">${KINDS.map(k => `<button class="kind-card" data-a="betKind" data-kind="${k.id}"><span class="k-emo" aria-hidden="true">${k.e}</span><span><b>${k.label}</b><small>${esc(k.hint)}</small></span></button>`).join("")}</div>
      <div class="row end"><button class="btn ghost" data-a="close">Cancel</button></div>`;
  }
  if (m.kind === "import") return importModal(cc);
  const d = m.draft;
  const kind = KINDS.find(k => k.id === m.kind);
  const others = visibleMembers(cc).filter(x => x.uid !== myId(cc));
  const catSel = `<label class="fld"><span>Category</span><select name="cat">${CATS.map(c => `<option value="${c.id}" ${d.cat === c.id ? "selected" : ""}>${c.e} ${c.label}</option>`).join("")}</select></label>`;
  const close = `<label class="fld"><span>${m.kind === "duel" ? "Answer expected before" : "Betting closes"}</span><input type="datetime-local" name="closesAt" required value="${esc(d.closesAt)}"></label>`;
  let body = "";
  if (m.kind === "match") {
    body = `<div class="grid2">
        <label class="fld"><span>Home team</span><input name="home" maxlength="40" required value="${esc(d.home || "")}" placeholder="E.g. Standard"></label>
        <label class="fld"><span>Away team</span><input name="away" maxlength="40" required value="${esc(d.away || "")}" placeholder="E.g. Anderlecht"></label>
      </div>
      <label class="check"><input type="checkbox" name="draw" ${d.draw !== false ? "checked" : ""}><span>Draw possible</span></label>
      <label class="check"><input type="checkbox" name="bonus" ${d.bonus !== false ? "checked" : ""}><span>Exact score bonus (+${nf(cc.circle.bonus)})</span></label>
      ${catSel}${close}`;
  } else if (m.kind === "duel") {
    body = others.length ? `<label class="fld"><span>Opponent</span><select name="to" required>${others.map(x => `<option value="${esc(x.uid)}" ${d.to === x.uid ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label class="fld"><span>I bet that…</span><input name="title" maxlength="120" required value="${esc(d.title || "")}" placeholder="E.g. Standard win the derby"></label>
      <label class="fld"><span>Each player's stake</span><input name="stake" type="number" inputmode="numeric" min="1" required value="${esc(d.stake || 100)}"></label>
      ${catSel}${close}` : `<p class="muted">You need at least one other member in the circle to start a duel.</p>`;
  } else {
    body = `<label class="fld"><span>${m.kind === "vote" ? "Election" : "Question"}</span><input name="title" maxlength="120" required value="${esc(d.title || "")}" placeholder="${m.kind === "vote" ? "E.g. Who will be the next mayor?" : m.kind === "yesno" ? "E.g. Will Julie forget her badge on Monday?" : "E.g. Who will be employee of the month?"}"></label>
      <label class="fld"><span>Details (optional)</span><textarea name="desc" rows="2" maxlength="300" placeholder="Rules, source of the result…">${esc(d.desc || "")}</textarea></label>
      ${m.kind === "yesno" ? "" : `<fieldset class="fld"><legend>${m.kind === "vote" ? "Candidates or parties" : "Possible choices"}</legend>
        <div class="opt-inputs">${d.opts.map((o, i) => `<div class="row"><input name="opt${i}" maxlength="50" value="${esc(o)}" placeholder="Choix ${i + 1}" aria-label="Choix ${i + 1}" ${i < 2 ? "required" : ""}>${d.opts.length > 2 ? `<button type="button" class="icon-btn" data-a="optDel" data-i="${i}" aria-label="Remove this choice">${ICON.x}</button>` : ""}</div>`).join("")}</div>
        ${d.opts.length < 12 ? `<button type="button" class="btn small ghost" data-a="optAdd">${ICON.plus} Add a choice</button>` : ""}
      </fieldset>`}
      ${catSel}${close}`;
  }
  return `<h2>${kind.e} ${kind.label}</h2>
    <form data-f="newBet" class="stack">${body}
      <div class="row between"><button type="button" class="btn ghost" data-a="betKind" data-kind="">Back</button>${m.kind === "duel" && !others.length ? "" : `<button class="btn primary">${m.kind === "duel" ? "Send the challenge" : "Publish the bet"}</button>`}</div>
    </form>`;
}

function importModal(cc) {
  const m = S.modal;
  const lg = m.league || LEAGUES[0].id;
  let list;
  if (m.loading) list = `<p class="muted center">Loading fixtures…</p>`;
  else if (m.err) list = `<div class="banner bad"><b>Fixtures unavailable</b><small>${esc(m.err)} You can create the match by hand with “Match”.</small></div>`;
  else if (!m.fx) list = "";
  else if (!m.fx.length) list = `<p class="muted center">No match in the next 14 days for this competition.</p>`;
  else {
    const existing = new Set(Object.values(cc.bets).filter(b => b.src).map(b => b.src.event));
    let lastDay = "";
    list = `<div class="fixtures">${m.fx.map(e => {
      const day = fmtDate(e.date, false);
      const head = day !== lastDay ? `<p class="fx-day">${day}</p>` : "";
      lastDay = day;
      const dup = existing.has(e.id);
      return `${head}<label class="fx ${dup ? "dup" : ""}"><input type="checkbox" name="fx" value="${esc(e.id)}" ${dup ? "disabled" : ""} ${(m.sel || []).includes(e.id) ? "checked" : ""}>
        <span class="fx-time">${fmtTime(e.date)}</span><span class="fx-teams">${esc(e.home)}<small>${esc(e.away)}</small></span>${dup ? `<small class="tag">already listed</small>` : ""}</label>`;
    }).join("")}</div>`;
  }
  return `<h2>Import matches</h2>
    <label class="fld"><span>Competition</span><select data-f="league">${LEAGUES.map(l => `<option value="${l.id}" ${l.id === lg ? "selected" : ""}>${CAT[l.cat].e} ${esc(l.name)} (${esc(l.country)})</option>`).join("")}</select></label>
    <form data-f="import" class="stack">
      ${list}
      ${m.fx && m.fx.length ? `<label class="check"><input type="checkbox" name="bonus" checked><span>Exact score bonus (+${nf(cc.circle.bonus)})</span></label>` : ""}
      <p class="source">Fixtures and scores: ESPN (unofficial public source). Betting closes at kick-off.</p>
      <div class="row between"><button type="button" class="btn ghost" data-a="betKind" data-kind="">Back</button>${m.fx && m.fx.length ? `<button class="btn primary">Create bets</button>` : ""}</div>
    </form>`;
}

async function loadFixtures(lg) {
  S.modal.league = lg; S.modal.loading = true; S.modal.err = ""; S.modal.fx = null; render();
  try { const fx = await Sports.fixtures(lg); if (S.modal && S.modal.league === lg) { S.modal.fx = fx; } }
  catch (e) { if (S.modal) S.modal.err = "The results source isn't responding."; }
  if (S.modal) { S.modal.loading = false; render(); }
}

function defaultClose() {
  const d = new Date(Date.now() + 86400000);
  d.setHours(20, 0, 0, 0);
  return toLocalInput(d.getTime());
}

/* Relit les champs du formulaire de création pour ne rien perdre lors d'un nouveau rendu */
function syncDraft() {
  const f = $('form[data-f="newBet"]');
  if (!f || !S.modal || !S.modal.draft) return;
  const fd = new FormData(f), d = S.modal.draft;
  for (const k of ["title", "desc", "cat", "closesAt", "home", "away", "to", "stake"]) if (fd.has(k)) d[k] = fd.get(k);
  if (f.querySelector('[name="draw"]')) d.draw = fd.has("draw");
  if (f.querySelector('[name="bonus"]')) d.bonus = fd.has("bonus");
  d.opts = d.opts.map((o, i) => fd.has("opt" + i) ? fd.get("opt" + i) : o);
}

/* ---------- Actions ---------- */
async function claim(type) {
  const cc = DB.cur(), me = myId(cc), day = dayNum();
  const amt = type === "daily" ? cc.circle.daily : cc.circle.rescue;
  const ok = await DB.put("ledger", `${me}_${type}_${day}`, { uid: me, type, amt, day, season: cc.circle.season, at: now() });
  if (ok) toast(type === "daily" ? `+${nf(amt)} tokens, your move!` : `The bank lends you ${nf(amt)} tokens. Use them wisely…`, "good");
}

async function setResult(cc, b, id, patch) {
  const ok = await DB.put("bets", id, Object.assign({ settledBy: myId(cc), settledAt: now() }, patch), true);
  if (ok) { S.modal = null; toast(patch.status === "void" ? "Bet cancelled: everyone is refunded" : "Result saved", "good"); render(); }
}

function betsAct(a, d) {
  const cc = DB.cur();
  const an = cc && cc.status === "ok" ? analysis(cc) : null;
  const info = an && S.betId ? an.bets[S.betId] : null;
  switch (a) {
    case "filter": S.filter = d.v; return true;
    case "openBet": go("bet", { betId: d.id }); return true;
    case "claimDaily": claim("daily"); return true;
    case "claimRescue": claim("rescue"); return true;
    case "newBet": S.modal = { k: "newBet" }; return true;
    case "betKind": {
      syncDraft();
      if (!d.kind) { S.modal = { k: "newBet" }; return true; }
      const draft = { closesAt: defaultClose(), cat: d.kind === "vote" ? "vote" : d.kind === "match" ? "foot" : d.kind === "duel" ? "potes" : "potes", opts: ["", ""] };
      if (d.kind === "vote") draft.opts = ["", "", ""];
      S.modal = { k: "newBet", kind: d.kind, draft };
      if (d.kind === "import") loadFixtures(S.lastLeague || LEAGUES[0].id);
      return true;
    }
    case "optAdd": syncDraft(); S.modal.draft.opts.push(""); return true;
    case "optDel": syncDraft(); S.modal.draft.opts.splice(+d.i, 1); return true;
    case "wager": {
      if (!info) return true;
      S.modal = { k: "wager", bet: S.betId, opt: d.opt };
      return true;
    }
    case "amt": case "amtSet": {
      const inp = $('form[data-f="wager"] input[name="amt"]');
      if (!inp) return true;
      const v = a === "amt" ? (parseInt(inp.value, 10) || 0) + parseInt(d.d, 10) : parseInt(d.v, 10);
      inp.value = Math.max(1, Math.min(+inp.max || v, v));
      updatePotential();
      return "keep";
    }
    case "duelAccept": {
      const me = myId(cc), b = info.b;
      const bal = an.players[me] ? an.players[me].bal : 0;
      if (bal < b.duel.stake) { toast("Not enough tokens to take this challenge", "bad"); return true; }
      DB.put("wagers", `${info.id}_${me}`, { bet: info.id, uid: me, opt: "n", amt: b.duel.stake, season: b.season, at: now() })
        .then(ok => ok && toast("Challenge accepted. May the best one win!", "good"));
      return true;
    }
    case "duelDecline":
      ask("Decline this challenge?", "Decline").then(ok => ok && DB.put("bets", info.id, { status: "void", settledBy: myId(cc), settledAt: now() }, true).then(ok => ok && toast("Challenge declined")));
      return true;
    case "settle": S.modal = { k: "settle", bet: S.betId }; return true;
    case "closeNow":
      ask("Close betting now?", "Close betting").then(ok => ok && DB.put("bets", info.id, { closesAt: now() }, true).then(ok => ok && toast("Betting closed")));
      return true;
    case "voidBet":
      ask("Cancel this bet? All stakes will be refunded.", "Cancel the bet", true).then(ok => ok && setResult(cc, info.b, info.id, { status: "void" }));
      return true;
    case "deleteBet":
      ask("Delete this bet?", "Delete", true).then(async ok => {
        if (!ok) return;
        {
          for (const w of info.ws) await DB.del("wagers", w.id);
          if (await DB.del("bets", info.id)) { toast("Bet deleted"); goBack(); }
        }
      });
      return true;
    case "checkResult":
      delete Sports.tried[info.id];
      toast("Checking with the source…");
      Sports.autoSettle().then(() => { const b = DB.cur().bets[info.id]; if (b && b.status === "open") toast("No final result yet"); });
      return true;
    case "flag": DB.put("flags", `${info.id}_${myId(cc)}`, { bet: info.id, uid: myId(cc), result: info.b.result, at: now() }).then(ok => ok && toast("Dispute recorded")); return true;
    case "unflag": DB.del("flags", `${info.id}_${myId(cc)}`); return true;
  }
  return false;
}

function updatePotential() {
  const cc = DB.cur(), an = analysis(cc);
  const inp = $('form[data-f="wager"] input[name="amt"]'), out = $("#potential");
  if (!inp || !out || !S.modal) return;
  const info = an.bets[S.modal.bet];
  const amt = Math.max(0, parseInt(inp.value, 10) || 0);
  S.modal.amt = amt;
  out.textContent = nf(potential(info, S.modal.opt, amt, myWager(info, myId(cc))));
}

function betsSubmit(f, fd) {
  const k = f.dataset.f;
  const cc = DB.cur();
  if (k === "wager") {
    const an = analysis(cc), info = an.bets[S.modal.bet], me = myId(cc);
    const amt = parseInt(fd.get("amt"), 10);
    const bal = an.players[me] ? an.players[me].bal : 0;
    if (info.state !== "open") { toast("Betting is closed", "bad"); S.modal = null; render(); return true; }
    if (!(amt >= 1)) { toast("Stake at least 1 token", "bad"); return true; }
    if (amt > bal) { toast(`You only have ${nf(bal)} tokens`, "bad"); return true; }
    const mine = myWager(info, me);
    const data = { bet: info.id, uid: me, opt: S.modal.opt, amt: (mine ? mine.amt : 0) + amt, season: info.b.season, at: mine ? mine.at : now() };
    if (mine && mine.score) data.score = mine.score;
    const sh = fd.get("sh"), sa = fd.get("sa");
    if (sh !== null && sa !== null && sh !== "" && sa !== "") data.score = { h: Math.max(0, parseInt(sh, 10) || 0), a: Math.max(0, parseInt(sa, 10) || 0) };
    DB.put("wagers", `${info.id}_${me}`, data).then(ok => { if (ok) { S.modal = null; toast(`${nf(amt)} tokens bet on ${optLabel(info.b, data.opt)}`, "good"); render(); } });
    return true;
  }
  if (k === "settle") {
    const an = analysis(cc), info = an.bets[S.modal.bet], b = info.b;
    if (b.kind === "match") {
      const h = parseInt(fd.get("sh"), 10), aa = parseInt(fd.get("sa"), 10);
      if (isNaN(h) || isNaN(aa)) return true;
      const res = matchResult(b, h, aa);
      setResult(cc, b, info.id, res ? { status: "settled", result: res, score: { h, a: aa }, closesAt: Math.min(b.closesAt, now()) } : { status: "void", score: { h, a: aa } });
    } else {
      const res = fd.get("res");
      if (!res) return true;
      setResult(cc, b, info.id, { status: "settled", result: res, closesAt: Math.min(b.closesAt, now()) });
    }
    return true;
  }
  if (k === "newBet") {
    syncDraft();
    const m = S.modal, d = m.draft, me = myId(cc);
    const closesAt = new Date(d.closesAt).getTime();
    if (!(closesAt > now() + 60000)) { toast("Pick a betting deadline in the future", "bad"); return true; }
    const id = rid(14);
    const bet = { kind: m.kind, cat: d.cat || "autre", closesAt, createdBy: me, createdAt: now(), season: cc.circle.season, status: "open", seed: cc.circle.seed, bonus: 0, title: "", desc: "" };
    if (m.kind === "yesno") { bet.title = d.title.trim(); bet.desc = (d.desc || "").trim(); bet.options = [{ id: "y", label: "Yes" }, { id: "n", label: "No" }]; }
    else if (m.kind === "multi" || m.kind === "vote") {
      const labels = [...new Set(d.opts.map(x => x.trim()).filter(Boolean))];
      if (labels.length < 2) { toast("You need at least two different choices", "bad"); return true; }
      bet.title = d.title.trim(); bet.desc = (d.desc || "").trim();
      bet.options = labels.map((l, i) => ({ id: "o" + (i + 1), label: l }));
    } else if (m.kind === "match") {
      bet.home = d.home.trim(); bet.away = d.away.trim();
      bet.title = bet.home + " – " + bet.away;
      bet.options = [{ id: "h", label: bet.home }].concat(d.draw ? [{ id: "d", label: "Draw" }] : [], [{ id: "a", label: bet.away }]);
      bet.bonus = d.bonus ? cc.circle.bonus : 0;
    } else if (m.kind === "duel") {
      const stake = parseInt(d.stake, 10);
      const an = analysis(cc), bal = an.players[me] ? an.players[me].bal : 0;
      if (!(stake >= 1)) { toast("Stake at least 1 token", "bad"); return true; }
      if (stake > bal) { toast(`You only have ${nf(bal)} tokens`, "bad"); return true; }
      const foe = memberOf(cc, d.to);
      bet.title = d.title.trim();
      bet.seed = 0;
      bet.duel = { to: d.to, stake };
      bet.options = [{ id: "y", label: memberOf(cc, me).name + " is right" }, { id: "n", label: foe.name + " is right" }];
    }
    if (!bet.title) { toast("Give your bet a title", "bad"); return true; }
    DB.put("bets", id, bet).then(async ok => {
      if (!ok) return;
      if (m.kind === "duel") await DB.put("wagers", `${id}_${me}`, { bet: id, uid: me, opt: "y", amt: bet.duel.stake, season: bet.season, at: now() });
      S.modal = null;
      toast(m.kind === "duel" ? "Challenge sent!" : "Bet published", "good");
      go("bet", { betId: id });
    });
    return true;
  }
  if (k === "import") {
    const ids = fd.getAll("fx");
    if (!ids.length) { toast("Tick at least one match", "bad"); return true; }
    const L = LEAGUE[S.modal.league];
    const bonus = fd.has("bonus") ? cc.circle.bonus : 0;
    const me = myId(cc);
    (async () => {
      let n = 0;
      for (const fid of ids) {
        const e = S.modal.fx.find(x => x.id === fid);
        if (!e) continue;
        if (await createMatchBet(cc, L.id, e, bonus > 0)) n++;
      }
      S.lastLeague = L.id;
      S.modal = null; S.filter = "open";
      toast(`${n} ${pl(n, "match imported", "matches imported")}`, "good");
      render();
    })();
    return true;
  }
  return false;
}

/* ===== feed.js ===== */
/* Pronohub — fil d'activité, commentaires, réactions */

function reactionsBar(cc, betId) {
  const me = myId(cc);
  const counts = {};
  let mine = null;
  for (const r of Object.values(cc.reacts)) {
    if (r.bet !== betId) continue;
    counts[r.e] = (counts[r.e] || 0) + 1;
    if (r.uid === me) mine = r.e;
  }
  return `<div class="reacts" role="group" aria-label="Reactions">${REACTIONS.map(e => `<button class="react ${mine === e ? "on" : ""}" data-a="react" data-bet="${esc(betId)}" data-e="${e}" aria-pressed="${mine === e}">${e}${counts[e] ? `<small>${counts[e]}</small>` : ""}</button>`).join("")}</div>`;
}

function commentsBlock(cc, betId) {
  const list = Object.entries(cc.comments).filter(([, c]) => c.bet === betId).sort((a, b) => a[1].at - b[1].at);
  return `<div class="comments">
    <h3>Comments${list.length ? ` <small>${list.length}</small>` : ""}</h3>
    ${list.length ? `<ul class="clist">${list.map(([id, c]) => commentItem(cc, id, c)).join("")}</ul>` : `<p class="muted">No banter yet. Go for it.</p>`}
    ${composer(betId)}
  </div>`;
}

function commentItem(cc, id, c) {
  const m = memberOf(cc, c.uid), me = myId(cc);
  return `<li class="cmt">${avatar(m, "sm")}<div class="bubble"><span class="who">${esc(m.name)} <time>${rel(c.at)}</time></span><p>${esc(c.text)}</p></div>
    ${c.uid === me || isOwner(cc) ? `<button class="icon-btn tiny" data-a="delComment" data-id="${esc(id)}" aria-label="Delete the comment">${ICON.x}</button>` : ""}</li>`;
}

function composer(betId) {
  return `<form data-f="comment" data-bet="${esc(betId || "")}" class="composer">
    <input name="text" maxlength="280" autocomplete="off" placeholder="${betId ? "Your prediction, your banter…" : "Write to the circle…"}" aria-label="Message" required>
    <button class="btn primary icon" aria-label="Send">${ICON.send}</button>
  </form>`;
}

/* Événements du fil, du plus récent au plus ancien */
function feedEvents(cc, a, limit = 80) {
  const ev = [];
  const name = uid => esc(memberOf(cc, uid).name);
  const betLink = (id, b) => `<button class="link" data-a="openBet" data-id="${esc(id)}">${esc(b.kind === "match" && b.home ? b.home + " – " + b.away : b.title)}</button>`;
  for (const [id, c] of Object.entries(cc.comments)) {
    const b = c.bet && cc.bets[c.bet];
    ev.push({ at: c.at, uid: c.uid, kind: "comment", id, html: `<b>${name(c.uid)}</b>${b ? ` on ${betLink(c.bet, b)}` : ""}`, text: c.text, bet: c.bet });
  }
  for (const [id, info] of Object.entries(a.bets)) {
    const b = info.b;
    if (b.kind === "duel") ev.push({ at: b.createdAt, uid: b.createdBy, kind: "bet", bet: id, html: `<b>${name(b.createdBy)}</b> challenges <b>${name(b.duel.to)}</b> : ${betLink(id, b)}, ${nf(b.duel.stake)} tokens` });
    else ev.push({ at: b.createdAt, uid: b.createdBy, kind: "bet", bet: id, html: `<b>${name(b.createdBy)}</b> started a bet: ${betLink(id, b)}` });
    if (info.state === "settled" || info.state === "contested") {
      const winners = info.ws.filter(w => info.payouts[w.id] > w.amt).sort((x, y) => (info.payouts[y.id] - y.amt) - (info.payouts[x.id] - x.amt));
      const wtxt = winners.length ? winners.slice(0, 4).map(w => `${name(w.u)} <span class="pos">+${nf(info.payouts[w.id] - w.amt)}</span>`).join(", ") + (winners.length > 4 ? "…" : "") : "nobody got it right";
      ev.push({ at: b.settledAt || b.closesAt, kind: "result", bet: id, html: `Result of ${betLink(id, b)} : <b>${esc(optLabel(b, b.result))}</b>${b.score ? ` (${b.score.h}–${b.score.a})` : ""}. ${wtxt}.` });
    } else if (info.state === "void" && b.settledAt) {
      ev.push({ at: b.settledAt, kind: "void", bet: id, html: `${betLink(id, b)} is cancelled, stakes refunded.` });
    }
    for (const w of info.ws) {
      ev.push({ at: w.at, uid: w.u, kind: "wager", bet: id, html: `<b>${name(w.u)}</b> placed a bet ${nf(w.amt)} on ${betLink(id, b)}` });
    }
  }
  for (const l of Object.values(cc.ledger)) {
    if (l.type === "rescue") ev.push({ at: l.at, uid: l.uid, kind: "rescue", html: `<b>${name(l.uid)}</b> got bailed out by the bank 💸` });
  }
  for (const m of visibleMembers(cc)) ev.push({ at: m.joinedAt || 0, uid: m.uid, kind: "join", html: `<b>${esc(m.name)}</b> joined the circle` });
  for (const s of Object.values(cc.seasons || {})) {
    const ch = s.standings && s.standings[0];
    ev.push({ at: s.endedAt, kind: "season", html: `End of season ${s.n}${ch ? ` : <b>${esc(ch.name)}</b> is crowned champion with ${nf(ch.bal)} tokens 🏆` : ""}` });
  }
  return ev.filter(e => e.at).sort((x, y) => y.at - x.at).slice(0, limit);
}

const FEED_ICON = { comment: "💬", bet: "🎟️", result: "🏁", void: "↩️", wager: "🪙", rescue: "💸", join: "👋", season: "🏆" };

function feedItem(cc, e) {
  const who = e.uid ? memberOf(cc, e.uid) : null;
  return `<li class="ev ev-${e.kind}">
    <span class="ev-ico">${who && e.kind === "comment" ? avatar(who, "sm") : `<span class="ev-emo" aria-hidden="true">${FEED_ICON[e.kind]}</span>`}</span>
    <div class="ev-body"><p>${e.html}</p>${e.text ? `<p class="ev-text">${esc(e.text)}</p>` : ""}<time>${rel(e.at)}</time></div>
  </li>`;
}

function feedTab(cc, a) {
  const ev = feedEvents(cc, a);
  return `<section class="page narrow">
    <h2 class="section-title">Circle feed</h2>
    ${composer(null)}
    ${ev.length ? `<ul class="feed">${ev.map(e => feedItem(cc, e)).join("")}</ul>` : `<div class="empty"><p class="empty-big">It's quiet here.</p><p>The circle's bets, results and banter will show up in this feed.</p></div>`}
  </section>`;
}

function feedAct(a, d) {
  const cc = DB.cur();
  switch (a) {
    case "react": {
      const me = myId(cc), id = `${d.bet}_${me}`;
      const cur = cc.reacts[id];
      if (cur && cur.e === d.e) DB.del("reacts", id);
      else DB.put("reacts", id, { bet: d.bet, uid: me, e: d.e, at: now() });
      return "keep";
    }
    case "delComment": DB.del("comments", d.id); return true;
  }
  return false;
}

function feedSubmit(f, fd) {
  if (f.dataset.f !== "comment") return false;
  const text = String(fd.get("text") || "").trim().slice(0, 280);
  if (!text) return true;
  const cc = DB.cur();
  DB.put("comments", rid(14), { uid: myId(cc), text, bet: f.dataset.bet || null, at: now(), season: cc.circle.season });
  f.reset();
  return "keep";
}

function playerCard(cc, a, uid, self) {
  const m = memberOf(cc, uid);
  const s = a.standings.find(x => x.uid === uid) || Object.assign({}, m, a.players[uid] || {});
  const p = a.players[uid] || { bets: 0, wins: 0 };
  const badges = badgesOf(cc, a, uid);
  const trophies = trophiesOf(cc, a, uid);
  const rate = p.bets ? Math.round(100 * p.wins / p.bets) : 0;
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const hist = (p.history || []).slice().reverse().slice(0, 15);
  return `<div class="profile-head">
      ${avatar(m, "xl")}
      <div class="grow"><h1 class="display small">${esc(m.name)}</h1>
        <p class="muted">${s.rank ? `Rank ${s.rank} / ${a.standings.length}` : ""}</p>
        ${m.solo && m.solo.level ? `<p class="solo-line">${esc(TITLES[m.solo.level - 1] || "")}, level ${m.solo.level} in solo${m.solo.best ? `, best ${m.solo.best} ${pl(m.solo.best, "stage", "stages")}` : ""}</p>` : ""}</div>
      ${self ? `<button class="btn small ghost" data-a="editProfile">Edit</button>` : ""}
    </div>
    <div class="balance-card"><span>Balance</span><b>${nf(s.bal || 0)}</b><small>${p.locked ? `incl. ${nf(p.locked)} at stake` : "tokens"}</small></div>
    <div class="stats">
      ${stat(p.bets, "bets settled")}
      ${stat(rate + " %", "success rate")}
      ${stat(nf(p.best || 0), "biggest win")}
      ${stat(p.maxStreak || 0, "best streak")}
      ${stat(p.bestOdds ? oddsFmt(p.bestOdds) : "—", "best odds")}
      ${stat(p.rescues || 0, pl(p.rescues || 0, "bankruptcy", "bankruptcies"))}
    </div>
    ${trophies.length ? `<h3>Trophies</h3><div class="trophies">${trophies.map(t => `<span class="trophy">${["🥇", "🥈", "🥉"][t.place - 1]} Season ${t.season}</span>`).join("")}</div>` : ""}
    <h3>Badges <small>${badges.length}/${BADGES.length}</small></h3>
    <div class="badges">${BADGES.map(bd => {
      const got = badges.includes(bd.id);
      return `<div class="badge ${got ? "got" : ""}"><span class="b-emo" aria-hidden="true">${bd.e}</span><b>${bd.name}</b><small>${bd.desc}</small></div>`;

    }).join("")}</ul>` : ""}`;
}

/* ---------- Matchs à venir (bandeau) ---------- */
const STRIP_LEAGUES = ["bel.1", "uefa.champions", "fra.1", "eng.1", "esp.1", "nba"];
const Strip = { lg: Store.get("stripLeague") || "bel.1", data: {}, loading: {}, err: {} };

async function loadStrip(lg, force = false) {
  if (Strip.loading[lg]) return;
  if (force) { delete Sports.cache["fx:" + lg + ":21"]; Store.del("fx." + lg); }
  Strip.loading[lg] = true; Strip.err[lg] = false;
  try { Strip.data[lg] = (await Sports.fixtures(lg, 21)).slice(0, 16); }
  catch (e) { Strip.err[lg] = true; }
  Strip.loading[lg] = false;
  queueRender();
}

function teamLogo(url, name) {
  return url ? `<img src="${esc(url)}" alt="" loading="lazy" width="28" height="28" onerror="this.style.visibility='hidden'">`
    : `<span class="crest" aria-hidden="true">${esc(name.charAt(0))}</span>`;
}

function matchStrip(cc) {
  const lg = Strip.lg;
  if (!Strip.data[lg] && !Strip.loading[lg] && !Strip.err[lg]) setTimeout(() => loadStrip(lg), 0);
  const list = Strip.data[lg];
  const existing = new Map();
  if (cc) for (const [id, b] of Object.entries(cc.bets)) if (b.src && b.status === "open") existing.set(b.src.event, id);
  const chips = STRIP_LEAGUES.map(id => {
    const L = LEAGUE[id];
    return `<button class="chip ${id === lg ? "on" : ""}" data-a="stripLeague" data-v="${id}" aria-pressed="${id === lg}">${CAT[L.cat].e} ${esc(L.name)}</button>`;
  }).join("");
  let body;
  if (!list && !Strip.err[lg]) body = `<div class="mrow">${[0, 1, 2].map(() => `<div class="mcard ghost" aria-hidden="true"></div>`).join("")}</div>`;
  else if (Strip.err[lg]) body = `<p class="strip-note">Fixtures aren't responding right now. <button class="link" data-a="stripRetry">Try again</button></p>`;
  else if (!list.length) body = `<p class="strip-note">No match in the next three weeks for this competition.</p>`;
  else body = `<div class="mrow">${list.map(e => {
    const bet = existing.get(e.id);
    return `<article class="mcard">
      <span class="m-when">${fmtDate(e.date)}</span>
      <span class="m-team">${teamLogo(e.homeLogo, e.home)}<b>${esc(e.home)}</b></span>
      <span class="m-team">${teamLogo(e.awayLogo, e.away)}<b>${esc(e.away)}</b></span>
      ${bet ? `<button class="btn small" data-a="openBet" data-id="${esc(bet)}">See the bet</button>`
        : `<button class="btn small primary" data-a="matchBet" data-lg="${lg}" data-id="${esc(e.id)}">Bet</button>`}
    </article>`;
  }).join("")}</div>`;
  return `<div class="strip">
    <div class="chips strip-chips" role="group" aria-label="Competitions">${chips}</div>
    ${body}
    <p class="source">Fixtures: ESPN (unofficial public source).</p>
  </div>`;
}

/* Crée (ou retrouve) le pari d'un match importé dans un cercle */
async function createMatchBet(cc, lgId, e, withBonus = true) {
  const L = LEAGUE[lgId];
  const id = "m_" + L.id.replace(/\./g, "") + "_" + e.id;
  if (cc.bets[id]) return id;
  if (e.date <= Date.now() + 60000) { toast("This match has already started", "bad"); return null; }
  const bet = {
    kind: "match", cat: L.cat, title: e.home + " – " + e.away, desc: "", home: e.home, away: e.away, homeLogo: e.homeLogo || "", awayLogo: e.awayLogo || "",
    options: [{ id: "h", label: e.home }].concat(L.draw ? [{ id: "d", label: "Draw" }] : [], [{ id: "a", label: e.away }]),
    closesAt: e.date, createdBy: myId(cc), createdAt: now(), season: cc.circle.season, status: "open", seed: cc.circle.seed,
    bonus: withBonus ? cc.circle.bonus : 0, src: { league: L.id, event: e.id },
  };
  return (await DB.put("bets", id, bet)) ? id : null;
}

/* Pari sur un match choisi depuis l'accueil : on ouvre le cercle, puis on crée le pari dès qu'il est prêt */
function processPendingMatch() {
  const pm = S.pendingMatch, cc = DB.cur();
  if (!pm || !cc || cc.status !== "ok" || !cc.circle || cc.code !== pm.code) return;
  S.pendingMatch = null;
  createMatchBet(cc, pm.lg, pm.e).then(id => { if (id) { toast("Bet created, place your stake!", "good"); go("bet", { betId: id }); } });
}

function startMatchBet(code, lg, e) {
  S.pendingMatch = { code, lg, e };
  if (S.code === code && DB.cur() && DB.cur().status === "ok") { S.modal = null; processPendingMatch(); return; }
  openCircle(code);
}

/* Résumé de chaque cercle, gardé sur l'appareil pour enrichir l'accueil */
function updateSnap(cc, a) {
  const me = myId(cc), s = a.standings.find(x => x.uid === me);
  if (!s) return;
  const bets = Object.values(a.bets);
  const snap = {
    bal: s.bal, rank: s.rank, n: a.standings.length,
    open: bets.filter(x => x.state === "open").length,
    todo: bets.filter(x => (x.state === "closed" || x.state === "contested") && canManage(cc, x.b, me)).length,
    faces: a.standings.slice(0, 5).map(x => ({ uid: x.uid, name: x.name, avatar: x.avatar || "" })),
  };
  const meta = MyCircles.list().find(c => c.code === cc.code);
  if (meta && JSON.stringify(meta.snap) !== JSON.stringify(snap)) MyCircles.update(cc.code, { snap });
}

/* ---------- Installation sur l'écran d'accueil ---------- */
const Install = {
  prompt: null,
  standalone() {
    try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; }
  },
  platform() {
    const ua = navigator.userAgent || "";
    if (/FBAN|FBAV|Instagram|WhatsApp|Messenger|Snapchat|Line\//i.test(ua)) return "inapp";
    const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (ios) return /CriOS|FxiOS|EdgiOS/.test(ua) ? "ios-other" : "ios";
    if (/Android/.test(ua)) return /SamsungBrowser/.test(ua) ? "samsung" : /Firefox/.test(ua) ? "android-firefox" : "android";
    return "desktop";
  },
  hidden() { const t = Store.get("installHide"); return t && Date.now() - t < 14 * 86400000; },
};
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); Install.prompt = e; queueRender(); });
window.addEventListener("appinstalled", () => { Install.prompt = null; toast("Pronohub is installed", "good"); queueRender(); });

function installCard() {

    <span class="grow"><b>${desk ? "Install Pronohub on your computer" : "Install Pronohub on your phone"}</b>
      <small>An icon on your home screen, full screen, without going through the browser.</small></span>
    <span class="install-acts">
      <button class="btn primary small" data-a="install">Install</button>
      <button class="icon-btn tiny" data-a="installHide" aria-label="Hide for two weeks">${ICON.x}</button>
    </span>
  </div>`;
}

/* ===== odds.js ===== */
/* Pronohub — cotes du mode solo.
   En solo il n'y a pas de pari mutuel : l'app calcule ses propres cotes avec un classement Elo,
   construit à partir des matchs joués avant la date du pari (jamais avec le résultat à deviner). */

/* Générateur pseudo-aléatoire reproductible (mulberry32) */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, r) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

const LOGO_BASE = "https://a.espncdn.com/i/teamlogos/";

/* Résultat d'un match : h, d, a, "void" (annulé) ou null (pas encore joué) */
function gameResult(g) {
  if (!g) return null;
  if (g.v) return "void";
  if (!g.c || g.x == null) return null;
  return g.x > g.y ? "h" : g.x < g.y ? "a" : "d";
}

const Odds = {
  mem: {},
  SEASONS: [2022, 2023, 2024, 2025],
  DAILY: ["bel.1", "eng.1", "fra.1", "esp.1", "ita.1", "ger.1", "uefa.champions", "uefa.europa", "ned.1"],

  curYm() { return Sports.ym(Date.now()); },
  addMonths(ym, n) {
    let y = +ym.slice(0, 4), m = +ym.slice(4) - 1 + n;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + String(m + 1).padStart(2, "0");
  },
  logo(p) { return p ? (p.startsWith("http") ? p : LOGO_BASE + p) : ""; },

  compact(e) {
    return {
      i: e.id, t: e.date, h: e.home, a: e.away,
      hl: (e.homeLogo || "").replace(LOGO_BASE, ""), al: (e.awayLogo || "").replace(LOGO_BASE, ""),
      x: e.sh, y: e.sa, c: e.completed ? 1 : 0,
      v: /POSTPONED|CANCEL|ABANDON|SUSPEND/.test(e.statusName) ? 1 : 0,
    };
  },

  /* Tous les matchs d'un mois, en version compacte. Les mois passés sont gardés sur l'appareil. */
  async month(lgId, ym, maxAge = 30 * 60000) {
    const key = lgId + ":" + ym, T = Date.now();
    const m = this.mem[key];
    if (m && (m.final || T - m.t < maxAge)) return m.list;
    const sk = Store.ns + "mo." + key;
    let st = null;
    try { st = JSON.parse(localStorage.getItem(sk)); } catch (e) { }
    if (st && (st.final || T - st.t < maxAge)) { this.mem[key] = st; return st.list; }
    const L = LEAGUE[lgId];
    const j = await Sports.get(`${Sports.base}${L.sport}/${L.id}/scoreboard?dates=${ym}&limit=500`);
    const seen = new Set();
    const list = (j.events || []).map(e => this.compact(Sports.parse(e))).filter(x => !seen.has(x.i) && seen.add(x.i));
    const rec = { t: T, final: ym < this.curYm(), list };
    this.mem[key] = rec;
    this.save(sk, rec);
    return list;
  },

  save(k, v) {
    const s = JSON.stringify(v);
    try { localStorage.setItem(k, s); }
    catch (e) {
      // Stockage plein : on vide le cache des matchs et on réessaie une fois
      try {
        for (const key of Object.keys(localStorage)) if (key.startsWith(Store.ns + "mo.")) localStorage.removeItem(key);
        localStorage.setItem(k, s);
      } catch (e2) { }
    }
  },

  /* Classement Elo et forme des équipes, d'après les matchs terminés avant `before` */
  ratings(list, before, sport) {
    const soccer = sport === "soccer";
    const K = soccer ? 24 : 14, H = soccer ? 55 : 60;
    const R = {}, form = {};
    const done = list.filter(m => m.c && !m.v && m.x != null && m.t < before).sort((a, b) => a.t - b.t);
    for (const m of done) {
      const rh = R[m.h] ?? 1500, ra = R[m.a] ?? 1500;
      const E = 1 / (1 + Math.pow(10, (ra - (rh + H)) / 400));
      const S = m.x > m.y ? 1 : m.x < m.y ? 0 : 0.5;
      const gd = Math.abs(m.x - m.y);
      const mult = soccer ? (gd <= 1 ? 1 : gd === 2 ? 1.5 : (11 + gd) / 8) : Math.min(2, 0.6 + Math.log(gd + 1) / 3);
      const d = K * mult * (S - E);
      R[m.h] = rh + d;
      R[m.a] = ra - d;
      (form[m.h] = form[m.h] || []).push(S === 1 ? "W" : S === 0 ? "L" : "D");
      (form[m.a] = form[m.a] || []).push(S === 0 ? "W" : S === 1 ? "L" : "D");
    }
    return { R, form, H };
  },

  /* Cotes 1N2 avec une marge de 7 %, comme un bookmaker raisonnable */
  price(rt, h, a, draw) {
    const rh = rt.R[h] ?? 1500, ra = rt.R[a] ?? 1500;
    const E = 1 / (1 + Math.pow(10, (ra - (rh + rt.H)) / 400));
    let p;
    if (draw) {
      const pd = Math.max(0.14, Math.min(0.29, 0.29 - Math.abs(rh + rt.H - ra) / 1600));
      p = { h: E - pd / 2, d: pd, a: 1 - E - pd / 2 };
    } else p = { h: E, a: 1 - E };
    for (const k in p) p[k] = Math.max(0.05, p[k]);
    const s = Object.values(p).reduce((x, y) => x + y, 0);
    const o = {};
    for (const k in p) o[k] = Math.max(1.05, Math.round(100 / ((p[k] / s) * 1.07)) / 100);
    return o;
  },

  game(m, lgId, rt) {
    return {
      id: m.i, lg: lgId, t: m.t, h: m.h, a: m.a, hl: m.hl, al: m.al,
      odds: this.price(rt, m.h, m.a, LEAGUE[lgId].draw),
      fh: (rt.form[m.h] || []).slice(-5).join(""), fa: (rt.form[m.a] || []).slice(-5).join(""),
      x: m.x, y: m.y, c: m.c, v: m.v,
    };
  },

  /* Une étape de Parcours : 5 matchs d'une même « journée » d'une saison passée */
  async retroStage(lgId, r) {
    const L = LEAGUE[lgId], soccer = L.sport === "soccer";
    for (let attempt = 0; attempt < 5; attempt++) {
      const y = this.SEASONS[Math.floor(r() * this.SEASONS.length)];
      const first = soccer ? y + "08" : y + "10";
      const valid = soccer
        ? [y + "10", y + "11", y + "12", (y + 1) + "01", (y + 1) + "02", (y + 1) + "03", (y + 1) + "04"]
        : [y + "12", (y + 1) + "01", (y + 1) + "02", (y + 1) + "03"];
      const ym = valid[Math.floor(r() * valid.length)];
      if (ym >= this.curYm()) continue;
      const months = [];
      for (let k = 3; k >= 0; k--) { const mm = this.addMonths(ym, -k); if (mm >= first) months.push(mm); }
      const lists = await Promise.all(months.map(mm => this.month(lgId, mm)));
      const all = lists.flat();
      const cur = lists[lists.length - 1].filter(m => m.c && !m.v && m.x != null);
      if (cur.length < 6) continue;
      const days = shuffle([...new Set(cur.map(m => startOfDay(m.t)))], r);
      for (const d of days) {
        const win = cur.filter(m => m.t >= d && m.t < d + 3 * 86400000);
        if (win.length < 4) continue;
        const rt = this.ratings(all, d, L.sport);
        const pick = shuffle(win, r).slice(0, 5).sort((a, b) => a.t - b.t);
        return { lg: lgId, season: y, games: pick.map(m => this.game(m, lgId, rt)) };
      }
    }
    throw new Error("no-stage");
  },

  /* Le Défi du jour : jusqu'à 6 vrais matchs des 48 prochaines heures, les mêmes pour tous */
  async daily(day, dayStartTs) {
    const r = rng(hashStr("daily" + day));
    const end = dayStartTs + 48 * 3600000;
    const months = [...new Set([Sports.ym(dayStartTs), Sports.ym(end)])];
    const pool = [], seen = new Set();
    const collect = async lg => {
      let lists;
      try { lists = await Promise.all(months.map(m => this.month(lg, m, 10 * 60000))); } catch (e) { return; }
      for (const m of lists.flat()) if (m.t >= dayStartTs && m.t < end && !m.v && !seen.has(m.i)) { seen.add(m.i); pool.push({ m, lg }); }
    };
    for (const lg of shuffle(this.DAILY, r)) { await collect(lg); if (pool.length >= 10) break; }
    if (pool.length < 4) await collect("nba");
    if (!pool.length) return [];
    const sel = shuffle(pool, r).slice(0, 6).sort((a, b) => a.m.t - b.m.t);
    const rts = {};
    const base = Sports.ym(dayStartTs);
    for (const { lg } of sel) {
      if (rts[lg]) continue;
      const ms = [this.addMonths(base, -2), this.addMonths(base, -1), base];
      const lists = await Promise.all(ms.map(mm => this.month(lg, mm).catch(() => [])));
      rts[lg] = this.ratings(lists.flat(), dayStartTs, LEAGUE[lg].sport);
    }
    return sel.map(({ m, lg }) => Object.assign(this.game(m, lg, rts[lg]), { x: null, y: null, c: 0, v: 0 }));
  },
};

const Solo = {
  st: null,
  s() { if (!this.st) this.load(); return this.st; },

    this.st = Object.assign({ rep: 0, runs: 0, best: 0, wins: 0, trophies: {}, streak: { last: "", n: 0 }, dailyCount: 0, run: null, daily: {} }, d);
    if (this.st.run) this.st.run.loading = false;
  },
  save() { Store.saveSoon("solo", this.st); this.syncSoon(); },
  level(rep = this.s().rep) { let l = 1; LEVELS.forEach((v, i) => { if (rep >= v) l = i + 1; }); return l; },
  title(l = this.level()) { return TITLES[l - 1]; },
  leagues(l = this.level()) { const out = []; for (let i = 1; i <= l; i++) out.push(...(LEAGUE_UNLOCK[i] || [])); return out; },
  pool(l = this.level()) { return ATOUTS.filter(a => a.lvl <= l); },
  avatars(l = this.level()) { return Object.entries(AVATAR_UNLOCK).filter(([k]) => +k <= l).map(([, v]) => v); },
  today(t = Date.now()) {
    const d = new Date(t);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  },
  streakOn() { const s = this.s().streak; return s.n > 1 && s.last >= this.today(Date.now() - 86400000) ? s.n : 0; },
  played() {
    const st = this.s(), t = this.today();
    if (st.streak.last === t) return;
    const y = this.today(Date.now() - 86400000);
    st.streak = { last: t, n: st.streak.last === y ? st.streak.n + 1 : 1 };
    if (st.streak.n >= 7) this.award("days7");
  },
  award(id) {
    const st = this.s();
    if (st.trophies[id]) return;
    st.trophies[id] = now();
    const t = SOLO_TROPHIES.find(x => x.id === id);
    if (t) setTimeout(() => toast(`Trophy unlocked: ${t.name}`, "good"), 600);
  },
  addRep(n) { const before = this.level(); this.s().rep += n; return { before, after: this.level() }; },
  unlocksAt(l) {
    const out = [];
    (LEAGUE_UNLOCK[l] || []).forEach(id => out.push(`${CAT[LEAGUE[id].cat].e} ${LEAGUE[id].name}`));
    ATOUTS.filter(a => a.lvl === l).forEach(a => out.push(`${a.e} ${a.name}`));
    if (AVATAR_UNLOCK[l]) out.push(`${AVATAR_UNLOCK[l]} New avatar`);
    out.push(`🏷️ ${TITLES[l - 1]}`);
    return out;
  },

  /* Ce que voient les amis dans les cercles */
  summary() {
    const st = this.s(), d = st.daily[this.today()];
    const played = d && d.tickets.length;
    return { day: played ? d.day : "", bank: played ? d.bank : 0, done: played ? !!d.done : false, n: played ? d.tickets.length : 0, level: this.level(), best: st.best, rep: st.rep };
  },
  syncSoon: debounce(function () { Solo.sync(); }, 1500),
  async sync() {
    if (!FB.ok || !FB.uid) return;
    const st = this.s();
    const meta = { rep: st.rep, runs: st.runs, best: st.best, wins: st.wins, trophies: st.trophies, dailyCount: st.dailyCount, streak: st.streak };
    const mj = JSON.stringify(meta);
    if (mj !== this._meta) { this._meta = mj; try { await FB.userDoc().set({ solo: meta }, { merge: true }); } catch (e) { this._meta = ""; } }
    const sum = this.summary(), sj = JSON.stringify(sum);
    if (sj === this._sum) return;
    this._sum = sj;
    for (const c of MyCircles.list().filter(c => !c.local)) {
      try { await FB.sub(c.code, "members").doc(FB.uid).set({ solo: sum }, { merge: true }); } catch (e) { }
    }
  },
  mergeRemote(r) {
    if (!r) return;
    const st = this.s();
    if ((r.rep || 0) > st.rep) Object.assign(st, { rep: r.rep, runs: r.runs || 0, best: r.best || 0, wins: r.wins || 0, dailyCount: r.dailyCount || 0 });
    st.trophies = Object.assign({}, r.trophies || {}, st.trophies);
    if (r.streak && r.streak.last > st.streak.last) st.streak = r.streak;
    this._meta = "";
    this.save();
  },
};
