<style>
/* Pronohub — styles */
:root {
  --bg: #f3f5fb;
  --paper: #ffffff;
  --paper-2: #eef1f9;
  --ink: #141b34;
  --ink-2: #4c5576;
  --ink-3: #8a91ad;
  --line: #dde2ef;
  --brand: #3b32e0;
  --brand-2: #ebe9ff;
  --brand-ink: #ffffff;
  --gold: #ffc531;
  --gold-ink: #7a4b00;
  --win: #11865a;
  --win-2: #e2f5ec;
  --lose: #d13450;
  --lose-2: #fde8ec;
  --shadow: 0 1px 0 rgba(20, 27, 52, .05), 0 8px 24px -10px rgba(20, 27, 52, .18);
  --r: 14px;
  --r-lg: 22px;
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --tabbar: 64px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #121a33;
  --paper: #1b2446;
  --paper-2: #232d55;
  --ink: #eef1fb;
  --ink-2: #b3bad6;
  --ink-3: #7d86aa;
  --line: #2f3a66;
  --brand: #8079ff;
  --brand-2: #2a2b6b;
  --brand-ink: #ffffff;
  --gold-ink: #6b4100;
  --win: #3ccf8e;
  --win-2: #173d36;
  --lose: #ff6f86;
  --lose-2: #45213a;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 10px 28px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--font);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  padding-bottom: calc(var(--tabbar) + var(--safe-b));
}
body[data-view="home"], body[data-view="settings"], body[data-view="state"] { padding-bottom: var(--safe-b); }
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; margin-top: 1.4em; }
h3 small { color: var(--ink-3); font-weight: 500; margin-left: .25em; }
p { margin: 0 0 .75em; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.muted { color: var(--ink-2); }
.small { font-size: .875rem; }
.center { text-align: center; }
.grow { flex: 1; min-width: 0; }
.pos { color: var(--win); font-weight: 700; }
.neg { color: var(--lose); font-weight: 700; }
.err { color: var(--lose); background: var(--lose-2); padding: .6em .8em; border-radius: 10px; font-weight: 500; }
.hint { color: var(--ink-3); font-size: .875rem; }
.note { color: var(--ink-2); font-size: .9rem; text-align: center; max-width: 34em; margin: 1.5em auto 0; }
.source { color: var(--ink-3); font-size: .78rem; margin-top: 1.2em; }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: .05em .5em; border-radius: 99px; background: var(--paper-2); color: var(--ink-2); vertical-align: middle; }

.row { display: flex; gap: .6rem; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; margin-top: 1rem; }
.row.between { justify-content: space-between; }
.row.center { justify-content: center; }
.stack { display: flex; flex-direction: column; gap: .9rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  min-height: 44px; padding: .55em 1.05em; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  font-weight: 600; text-decoration: none; transition: transform .12s, background .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--paper-2); }
.btn.danger { color: var(--lose); }
.btn.danger:not(.ghost) { border-color: var(--lose); }
.btn.big { min-height: 54px; font-size: 1.05rem; padding: .7em 1.4em; border-radius: 16px; }
.btn.small { min-height: 38px; padding: .35em .85em; font-size: .9rem; }
.btn.tiny { min-height: 32px; padding: .2em .6em; font-size: .8rem; }
.btn.wide { width: 100%; }
.btn.icon { padding: 0; width: 44px; }
.btn .g { font-weight: 800; width: 1.4em; height: 1.4em; border-radius: 50%; background: #fff; color: #3b32e0; display: inline-grid; place-items: center; font-size: .85em; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
  background: transparent; border: 0; color: var(--ink-2);
}
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }
.icon-btn.tiny { width: 32px; height: 32px; }
.link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; text-align: left; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; }

.segs { display: flex; gap: .3rem; padding: .25rem; background: var(--paper-2); border-radius: 14px; overflow-x: auto; scrollbar-width: none; }
.seg {
  flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 10px; padding: .3em .9em;
  font-weight: 600; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: .4em;
}
.seg.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 27, 52, .12); }
:root[data-theme="dark"] .seg.on, :root[data-theme="dark"] .seg.radio:has(input:checked) { background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line); }
.seg .count { font-size: .75rem; background: var(--line); color: var(--ink-2); border-radius: 99px; padding: 0 .5em; min-width: 1.6em; }
.seg.on .count { background: var(--brand); color: var(--brand-ink); }
.seg.radio input { position: absolute; opacity: 0; pointer-events: none; }
.seg.radio:has(input:checked) { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 27, 52, .12); }
.seg.radio:has(input:focus-visible) { outline: 3px solid var(--brand); }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { min-height: 40px; padding: .3em .9em; border-radius: 99px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--brand); }
.chip.hot { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 22%, var(--paper)); }

/* ---------- Champs ---------- */
.fld { display: flex; flex-direction: column; gap: .35rem; border: 0; padding: 0; margin: 0; min-width: 0; }
.fld > span, .fld > legend { font-weight: 600; font-size: .9rem; color: var(--ink-2); padding: 0; }
input:not([type=radio]):not([type=checkbox]):not([type=file]), select, textarea {
  width: 100%; min-height: 46px; padding: .6em .8em; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-2); }
textarea { resize: vertical; }
.check { display: flex; align-items: center; gap: .6rem; min-height: 44px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }
.code-input { font-size: 1.6rem !important; font-weight: 700; text-align: center; letter-spacing: .14em; font-variant-numeric: tabular-nums; }
details.adv summary { cursor: pointer; font-weight: 600; color: var(--brand); min-height: 44px; display: flex; align-items: center; }
details.adv[open] summary { margin-bottom: .6rem; }

.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: .35rem; }
.emoji-grid.small { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
.emo { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 12px; background: var(--paper-2); font-size: 1.5rem; cursor: pointer; border: 2px solid transparent; transition: transform .12s; }
.emo input { position: absolute; opacity: 0; pointer-events: none; }
.emo.on, .emo:has(input:checked) { border-color: var(--brand); background: var(--brand-2); transform: scale(1.06); }
.emo:has(input:focus-visible) { outline: 3px solid var(--brand); }

.choice-list { display: flex; flex-direction: column; gap: .45rem; }
.choice {
  display: flex; align-items: center; gap: .75rem; padding: .7rem .9rem; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--paper); cursor: pointer; text-align: left; min-height: 52px; width: 100%;
}
.choice input { accent-color: var(--brand); width: 20px; height: 20px; flex: none; }
.choice span { display: flex; flex-direction: column; }
.choice small { color: var(--ink-2); font-size: .85rem; }
.choice.on, .choice:has(input:checked) { border-color: var(--brand); background: var(--brand-2); }
.choice.disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Avatars et jetons ---------- */
.av {
  --h: 230; flex: none; width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center;
  background: hsl(var(--h) 85% 90%); color: hsl(var(--h) 60% 28%); font-weight: 700; font-size: 1.1rem; line-height: 1;
}
:root[data-theme="dark"] .av { background: hsl(var(--h) 40% 30%); color: hsl(var(--h) 90% 88%); }
.av.sm { width: 28px; height: 28px; font-size: .9rem; }
.av.lg { width: 56px; height: 56px; font-size: 1.7rem; }
.av.xl { width: 72px; height: 72px; font-size: 2.2rem; }
.coin {
  display: inline-block; width: 1em; height: 1em; border-radius: 50%; flex: none; vertical-align: -.12em;
  background: radial-gradient(circle at 35% 30%, #ffe28a 0 25%, var(--gold) 26%);
  box-shadow: inset 0 0 0 2px #e9a400;
}

/* ---------- En-tête et onglets ---------- */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .5rem;
  padding: calc(.5rem + var(--safe-t)) max(.75rem, env(safe-area-inset-right)) .5rem max(.75rem, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.circle-btn {
  display: flex; align-items: center; gap: .45rem; min-height: 44px; min-width: 0; padding: .2rem .6rem .2rem .3rem;
  border: 0; border-radius: 14px; background: transparent; font-weight: 700; font-size: 1.05rem;
}
.circle-btn:hover { background: var(--paper-2); }
.cb-emo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: var(--paper); box-shadow: var(--shadow); font-size: 1.25rem; }
.cb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
.circle-btn svg { flex: none; color: var(--ink-3); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: .3rem; }
.coin-chip {
  display: inline-flex; align-items: center; gap: .4rem; min-height: 40px; padding: .2rem .8rem .2rem .55rem; border-radius: 99px;
  border: 0; background: var(--ink); color: var(--bg); font-weight: 700; font-variant-numeric: tabular-nums; font-size: .98rem;
}
.actor-chip { display: inline-flex; align-items: center; gap: .35rem; min-height: 40px; padding: .2rem .65rem .2rem .25rem; border-radius: 99px; border: 1.5px dashed var(--ink-3); background: transparent; font-weight: 600; font-size: .85rem; max-width: 34vw; }
.actor-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 639px) {
  .actor-chip { padding: .2rem; }
  .actor-chip span:last-child { display: none; }
}
.top-tabs { display: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--ink-3); min-height: 44px; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--brand); }
.tabbar button.on svg { stroke-width: 2.4; }

.fab {
  position: fixed; right: max(1rem, env(safe-area-inset-right)); bottom: calc(var(--tabbar) + var(--safe-b) + 1rem); z-index: 25;
  display: inline-flex; align-items: center; gap: .5rem; height: 56px; padding: 0 1.3rem 0 1.05rem; border-radius: 18px; border: 0;
  background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 1rem;
  box-shadow: 0 10px 24px -8px color-mix(in srgb, var(--brand) 70%, transparent);
}
.fab svg { width: 22px; height: 22px; stroke-width: 2.6; }
.fab:active { transform: scale(.96); }

/* ---------- Mise en page ---------- */
.shell { max-width: 760px; margin: 0 auto; padding: 0 max(1rem, env(safe-area-inset-left)) 2rem max(1rem, env(safe-area-inset-right)); }
.page { padding-top: 1rem; padding-bottom: 5.5rem; }
body[data-view="home"] .page, body[data-view="settings"] .page { padding-bottom: 2rem; }
.page.narrow { max-width: 640px; margin: 0 auto; }
.pagehead { display: flex; align-items: center; gap: .5rem; margin: 0 0 .6rem -.5rem; }
.pagehead h1 { margin: 0; font-size: 1.5rem; }
.side { display: none; }
.section-title { font-size: 1.5rem; margin: .2rem 0 .8rem; }
.panel { background: var(--paper); border-radius: var(--r-lg); padding: 1.1rem 1.15rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.panel h3:first-child { margin-top: 0; }
.panel .segs { margin-bottom: .4rem; }

/* ---------- Accueil ---------- */
.welcome { max-width: 520px; margin: 0 auto; padding-top: calc(1.5rem + var(--safe-t)); }
.welcome-hero { text-align: center; padding: 1rem 0 1.5rem; }
.logo-mark { display: inline-block; transform: rotate(-8deg); }
.logo-mark svg { width: 84px; height: 84px; }
.brand { font-size: clamp(3rem, 14vw, 4.6rem); font-weight: 800; letter-spacing: -.045em; margin: .1em 0 .15em; font-variation-settings: "opsz" 96; }
.lead { font-size: 1.1rem; color: var(--ink-2); max-width: 26em; margin: 0 auto; }
.welcome-form .btn.big { margin-top: .4rem; }

.home { max-width: 640px; margin: 0 auto; padding-top: calc(1.5rem + var(--safe-t)); }
.hello { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.4rem; }
.kicker { color: var(--ink-2); font-weight: 600; margin: 0 0 .1rem; }
.display { font-size: clamp(1.9rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: -.035em; margin: 0; font-variation-settings: "opsz" 72; }
.display.small { font-size: 1.8rem; }
.circle-list { display: flex; flex-direction: column; gap: .6rem; margin-bottom: 1.4rem; }
.circle-list.compact { margin-bottom: 1rem; }
.circle-card {
  display: flex; align-items: center; gap: .9rem; width: 100%; text-align: left; padding: .85rem 1rem; min-height: 68px;
  border-radius: 18px; border: 1.5px solid transparent; background: var(--paper); box-shadow: var(--shadow);
}
.circle-card:hover { border-color: var(--line); }
.circle-card.on { border-color: var(--brand); }
.cc-emoji { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 1.6rem; background: var(--paper-2); flex: none; }
.cc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cc-body b { font-size: 1.08rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-body small { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cc-go { color: var(--ink-3); }
.empty-hero { background: var(--paper); border-radius: var(--r-lg); padding: 1.2rem 1.3rem; box-shadow: var(--shadow); margin-bottom: 1.4rem; font-size: 1.05rem; color: var(--ink-2); }
.empty-hero p { margin: 0; }
.home-actions { display: grid; grid-template-columns: 1fr; gap: .6rem; }

.state { min-height: 70dvh; display: grid; place-items: center; }
.state-box { text-align: center; max-width: 30em; }
.state-box p { color: var(--ink-2); }

/* ---------- Bonus du jour ---------- */
.gift {
  display: flex; align-items: center; gap: .8rem; padding: .8rem .9rem; border-radius: 18px; margin-bottom: .8rem;
  background: color-mix(in srgb, var(--gold) 26%, var(--paper)); border: 1.5px solid color-mix(in srgb, var(--gold) 70%, transparent);
}
.gift.broke { background: var(--paper); border-color: var(--line); border-style: dashed; }
.gift-coin { font-size: 1.8rem; line-height: 1; }
.gift .grow { display: flex; flex-direction: column; }
.gift small { color: var(--ink-2); }

.tabs-filter { margin-bottom: 1rem; }

/* ---------- Tickets ---------- */
.tickets { display: grid; gap: 1rem; }
.ticket {
  --notch: 52px;
  position: relative; isolation: isolate; padding: 1rem 1.05rem 0;
  filter: drop-shadow(0 1px 0 color-mix(in srgb, var(--line) 90%, transparent)) drop-shadow(0 8px 14px rgba(20, 27, 52, .08));
}
:root[data-theme="dark"] .ticket { filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35)); }
.ticket::before {
  content: ""; position: absolute; inset: 0; z-index: -1; background: var(--paper); border-radius: 18px;
  -webkit-mask: radial-gradient(circle 10px at 0 calc(100% - var(--notch)), #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 10px at 100% calc(100% - var(--notch)), #0000 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 10px at 0 calc(100% - var(--notch)), #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 10px at 100% calc(100% - var(--notch)), #0000 97%, #000) right / 51% 100% no-repeat;
}
.ticket.has-mine::after { content: ""; position: absolute; left: 0; top: 18px; bottom: calc(var(--notch) + 16px); width: 4px; border-radius: 0 4px 4px 0; background: var(--brand); }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-size: .84rem; color: var(--ink-2); font-weight: 600; }
.t-cat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-time { display: inline-flex; align-items: center; gap: .3em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-time svg { width: 15px; height: 15px; }
.t-time.live { color: var(--brand); }
.t-title { font-size: 1.22rem; font-weight: 700; margin: .45rem 0 .2rem; letter-spacing: -.015em; }
.t-sub { color: var(--ink-2); font-size: .9rem; margin: 0 0 .4rem; }
.t-opts { display: grid; gap: .4rem; margin: .7rem 0 .9rem; }
.t-opts.n2 { grid-template-columns: 1fr 1fr; }
.t-opts.n3 { grid-template-columns: 1fr 1fr 1fr; }
.t-opts.n4 { grid-template-columns: 1fr 1fr; }
.t-opt {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: .05rem; padding: .5rem .65rem .6rem; border-radius: 12px;
  background: var(--paper-2); min-width: 0;
}
.t-lbl { font-size: .84rem; color: var(--ink-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-odd { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.t-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: var(--w); background: var(--ink-3); border-radius: 0 3px 3px 0; opacity: .5; }
.t-opt.mine { background: var(--brand-2); box-shadow: inset 0 0 0 2px var(--brand); }
.t-opt.mine .t-bar { background: var(--brand); opacity: 1; }
.t-opt.win { background: var(--win-2); box-shadow: inset 0 0 0 2px var(--win); }
.t-opt.win .t-odd { color: var(--win); }
.t-more { display: grid; place-items: center; font-size: .84rem; color: var(--ink-2); font-weight: 600; border: 1.5px dashed var(--line); border-radius: 12px; }
.t-foot {
  height: var(--notch); display: flex; align-items: center; gap: 1rem; font-size: .86rem; color: var(--ink-2); font-weight: 600;
  border-top: 2px dashed var(--line); margin: 0 .2rem; font-variant-numeric: tabular-nums;
}
.t-foot > span:first-child { display: inline-flex; align-items: center; gap: .35em; color: var(--ink); }
.t-mine, .t-cta { margin-left: auto; }
.t-mine { color: var(--brand); }
.t-cta { color: var(--brand); }
.t-link { position: absolute; inset: 0; z-index: 2; border: 0; background: transparent; border-radius: 18px; }
.t-link:focus-visible { outline-offset: -3px; }
.ticket.st-void, .ticket.st-settled:not(.has-mine) { opacity: .82; }
.stamp {
  position: absolute; bottom: calc(var(--notch) / 2 - 17px); right: .9rem; z-index: 1; transform: rotate(-7deg);
  padding: .15rem .6rem; border: 3px solid currentColor; border-radius: 8px; font-weight: 800; font-size: .95rem; letter-spacing: .02em;
  background: color-mix(in srgb, var(--paper) 80%, transparent); font-variant-numeric: tabular-nums;
}
.stamp.win { color: var(--win); }
.stamp.lose { color: var(--lose); }
.stamp.void { color: var(--ink-3); }
.ticket:has(.stamp) .t-mine, .ticket:has(.stamp) .t-cta { display: none; }

.match { display: flex; align-items: center; gap: .5rem; flex-wrap: nowrap; }
.team { display: inline-flex; align-items: center; gap: .45rem; min-width: 0; flex: 1; }
.team.away { justify-content: flex-end; text-align: right; }
.team img, .crest { width: 22px; height: 22px; flex: none; object-fit: contain; }
.crest { display: inline-grid; place-items: center; border-radius: 6px; background: var(--paper-2); font-size: .75rem; color: var(--ink-2); }
.vs { color: var(--ink-3); font-weight: 800; padding: 0 .2rem; font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 2rem 1rem; color: var(--ink-2); }
.empty-big { font-size: 1.35rem; font-weight: 700; color: var(--ink); margin-bottom: .3rem; }

/* ---------- Détail d'un pari ---------- */
.bet-hero { margin-bottom: 1rem; }
.bet-title { font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 800; letter-spacing: -.03em; margin: .2rem 0 .4rem; }
.bet-title .match { flex-wrap: wrap; }
.bet-title .team img, .bet-title .crest { width: 34px; height: 34px; }
.bet-desc { font-size: 1.05rem; }
.bet-meta { color: var(--ink-2); font-size: .92rem; margin: 0 0 .15rem; }
.banner { border-radius: 16px; padding: .8rem 1rem; background: var(--paper-2); margin-bottom: 1rem; display: flex; flex-direction: column; gap: .1rem; }
.banner small { color: var(--ink-2); }
.banner.good { background: var(--win-2); }
.banner.good b { color: var(--win); }
.banner.bad { background: var(--lose-2); }
.banner.bad b { color: var(--lose); }
.opts { display: flex; flex-direction: column; gap: .55rem; }
.opt {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left;
  padding: .85rem 1rem; min-height: 64px; border-radius: 16px; border: 2px solid transparent; background: var(--paper); box-shadow: var(--shadow);
}
.opt.can:hover { border-color: var(--brand); }
.opt.can:active { transform: scale(.99); }
.opt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.opt-main b { font-size: 1.08rem; }
.opt-main small { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.opt-odd { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.opt-bar { position: absolute; left: 0; bottom: 0; height: 4px; width: var(--w); background: var(--ink-3); opacity: .45; }
.opt.mine { border-color: var(--brand); background: var(--brand-2); }
.opt.mine .opt-bar { background: var(--brand); opacity: 1; }
.opt.win { border-color: var(--win); background: var(--win-2); }
.opt.win .opt-odd { color: var(--win); }
.opt-check { color: var(--win); display: grid; place-items: center; }
.pool-line { display: flex; align-items: baseline; gap: .45rem; margin: .9rem 0 1rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pool-line b { color: var(--ink); }
.mine-panel .row { padding: .25rem 0; }
.mine-panel .btn { margin-top: .5rem; }
.panel.duel { background: color-mix(in srgb, var(--gold) 20%, var(--paper)); }
.contest { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; padding: .7rem .9rem; border-radius: 14px; border: 1.5px dashed var(--line); margin-bottom: 1rem; }
.contest small { color: var(--ink-3); display: block; }
.acts { margin: .2rem 0 1rem; }
.bettors, .member-list, .ranking, .mini-rank, .history, .honours, .clist, .feed { list-style: none; margin: 0; padding: 0; }
.bettors li, .member-list li { display: flex; align-items: center; gap: .7rem; padding: .55rem 0; border-bottom: 1px solid var(--line); }
.bettors li span.grow, .member-list li span.grow { display: flex; flex-direction: column; }
.bettors small { color: var(--ink-2); }
.bettors .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; }
.member-list li span.grow { flex-direction: row; align-items: center; gap: .4rem; flex-wrap: wrap; }

.reacts { display: flex; gap: .4rem; margin: 1rem 0; flex-wrap: wrap; }
.react { min-width: 52px; min-height: 44px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--paper); font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; gap: .25rem; padding: 0 .7rem; }
.react small { font-size: .82rem; font-weight: 700; color: var(--ink-2); }
.react.on { border-color: var(--brand); background: var(--brand-2); }

.comments h3 small { color: var(--ink-3); }
.cmt { display: flex; gap: .6rem; align-items: flex-start; margin-bottom: .7rem; }
.bubble { background: var(--paper); border-radius: 4px 16px 16px 16px; padding: .5rem .8rem; box-shadow: var(--shadow); min-width: 0; flex: 1; }
.bubble p { margin: 0; overflow-wrap: anywhere; }
.who { font-weight: 700; font-size: .85rem; }
.who time { color: var(--ink-3); font-weight: 500; margin-left: .3em; }
.composer { display: flex; gap: .5rem; margin: .8rem 0 1rem; }
.composer input { border-radius: 99px !important; padding-left: 1.1em !important; }
.composer .btn { border-radius: 50%; flex: none; }

/* ---------- Fil ---------- */
.feed .ev { display: flex; gap: .75rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
.ev-ico { flex: none; width: 32px; display: grid; justify-items: center; }
.ev-emo { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: var(--paper-2); font-size: 1rem; }
.ev-body { flex: 1; min-width: 0; }
.ev-body p { margin: 0; overflow-wrap: anywhere; }
.ev-text { background: var(--paper); border-radius: 4px 14px 14px 14px; padding: .4rem .75rem; margin-top: .3rem !important; box-shadow: var(--shadow); display: inline-block; }
.ev-body time { display: block; font-size: .78rem; color: var(--ink-3); margin-top: .15rem; }
.feed .link, .history .link { text-decoration: none; }
.feed .link:hover, .history .link:hover { text-decoration: underline; }
.feed.mini .ev { padding: .5rem 0; font-size: .9rem; }

/* ---------- Classement ---------- */
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: .5rem; margin: .4rem 0 1.4rem; }
.pod { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: 0; min-width: 0; }
.pod b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod-bal { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.pod-step { width: 100%; display: grid; place-items: start center; padding-top: .4rem; border-radius: 14px 14px 4px 4px; font-weight: 800; font-size: 1.6rem; color: var(--gold-ink); }
.p1 .pod-step { height: 96px; background: linear-gradient(var(--gold), color-mix(in srgb, var(--gold) 55%, var(--paper))); }
.p2 .pod-step { height: 70px; background: linear-gradient(#d9deea, color-mix(in srgb, #d9deea 50%, var(--paper))); color: #4c5576; }
.p3 .pod-step { height: 54px; background: linear-gradient(#f0b98a, color-mix(in srgb, #f0b98a 50%, var(--paper))); color: #6b3a12; }
.ranking li button {
  width: 100%; display: flex; align-items: center; gap: .7rem; padding: .65rem .8rem; border: 0; background: var(--paper);
  text-align: left; min-height: 60px; border-radius: 14px; margin-bottom: .4rem; box-shadow: var(--shadow);
}
.ranking li.me button { box-shadow: inset 0 0 0 2px var(--brand), var(--shadow); }
.ranking .grow { display: flex; flex-direction: column; }
.ranking small { color: var(--ink-2); }
.rk { width: 1.6em; text-align: center; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bal { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.08rem; }
.mini-rank li { display: flex; align-items: center; gap: .55rem; padding: .35rem 0; font-variant-numeric: tabular-nums; }
.mini-rank li.me { color: var(--brand); font-weight: 700; }
.honours li { display: flex; flex-wrap: wrap; gap: .3rem .9rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.h-season { font-weight: 700; width: 100%; }
.h-place small { color: var(--ink-3); }

/* ---------- Profil ---------- */
.profile-head { display: flex; align-items: center; gap: 1rem; margin: .4rem 0 1rem; }
.profile-head .display { margin-bottom: .1rem; }
.profile-head p { margin: 0; }
.balance-card {
  display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; padding: 1rem 1.2rem; border-radius: var(--r-lg); margin-bottom: 1rem;
  background: var(--ink); color: var(--bg);
}
.balance-card span { font-weight: 600; opacity: .75; }
.balance-card b { font-size: 2.4rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.balance-card small { opacity: .75; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.stat { background: var(--paper); border-radius: 14px; padding: .7rem .75rem; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
.stat b { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--ink-2); line-height: 1.25; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .5rem; }
.badge { display: flex; flex-direction: column; padding: .7rem .75rem; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--ink-3); }
.badge .b-emo { font-size: 1.6rem; filter: grayscale(1); opacity: .45; }
.badge b { font-size: .92rem; }
.badge small { font-size: .78rem; line-height: 1.25; }
.badge.got { border: 0; background: var(--paper); box-shadow: var(--shadow); color: var(--ink); }
.badge.got .b-emo { filter: none; opacity: 1; }
.badge.got small { color: var(--ink-2); }
.trophies { display: flex; flex-wrap: wrap; gap: .4rem; }
.trophy { padding: .35rem .8rem; border-radius: 99px; background: color-mix(in srgb, var(--gold) 25%, var(--paper)); font-weight: 600; }
.history li { display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.me-actions { margin-top: 1.5rem; }

/* ---------- Fenêtres ---------- */
#overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(12, 16, 34, .5); display: flex; align-items: flex-end; justify-content: center;
  animation: fade .18s ease-out;
}
.sheet {
  position: relative; width: 100%; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg);
  border-radius: 24px 24px 0 0; padding: 1.4rem 1.15rem calc(1.2rem + var(--safe-b)); outline: none;
  animation: up .24s cubic-bezier(.2, .9, .3, 1.1);
}
.sheet > h2 { padding-right: 2.5rem; }
.sheet-x { position: absolute; top: .7rem; right: .7rem; }
.sheet h3 { margin-top: 1.4rem; }
.modal-foot { margin-top: 1.4rem; }
.code-big { font-size: 2.6rem; font-weight: 800; letter-spacing: .12em; text-align: center; padding: 1rem; margin: .8rem 0 1rem; border-radius: 18px; background: var(--paper); border: 2px dashed var(--brand); font-variant-numeric: tabular-nums; }
.code-big.small { font-size: 1.4rem; }
.prose p { color: var(--ink-2); }
.prose b { color: var(--ink); }

.kind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .5rem; }
.kind-card {
  display: flex; gap: .7rem; align-items: flex-start; text-align: left; padding: .85rem .9rem; border-radius: 16px; border: 1.5px solid var(--line);
  background: var(--paper); min-height: 64px; width: 100%;
}
.kind-card:hover { border-color: var(--brand); }
.kind-card span:last-child { display: flex; flex-direction: column; }
.kind-card small { color: var(--ink-2); font-size: .82rem; line-height: 1.3; }
.kind-card.feature { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.kind-card.feature small { color: color-mix(in srgb, var(--brand-ink) 80%, transparent); }
.k-emo { font-size: 1.5rem; line-height: 1.1; }
.opt-inputs { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .3rem; }

.fixtures { max-height: 46dvh; overflow-y: auto; border-radius: 14px; background: var(--paper); padding: .2rem .7rem; box-shadow: var(--shadow); }
.fx-day { position: sticky; top: 0; background: var(--paper); margin: 0; padding: .6rem 0 .3rem; font-weight: 700; font-size: .85rem; color: var(--ink-2); }
.fx-day::first-letter { text-transform: uppercase; }
.fx { display: flex; align-items: center; gap: .7rem; min-height: 54px; border-top: 1px solid var(--line); cursor: pointer; }
.fx input { width: 20px; height: 20px; accent-color: var(--brand); flex: none; }
.fx-time { font-weight: 700; font-variant-numeric: tabular-nums; width: 3em; }
.fx-teams { flex: 1; display: flex; flex-direction: column; font-weight: 600; min-width: 0; }
.fx-teams small { font-weight: 600; font-size: 1rem; }
.fx.dup { opacity: .5; }

.wager-on { font-size: 1.05rem; }
.amount { display: grid; grid-template-columns: 52px 1fr 52px; gap: .5rem; align-items: center; }
.amount input::-webkit-outer-spin-button, .amount input::-webkit-inner-spin-button, .score input::-webkit-inner-spin-button, .score input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.amount input, .score input { -moz-appearance: textfield; appearance: textfield; }
.amount input { font-size: 2rem !important; font-weight: 800; text-align: center; min-height: 64px !important; font-variant-numeric: tabular-nums; }
.amount .icon-btn { width: 52px; height: 52px; font-size: 1.6rem; background: var(--paper); border: 1.5px solid var(--line); color: var(--ink); }
.potential { margin: 0; }
.potential b { font-size: 1.3rem; color: var(--win); font-variant-numeric: tabular-nums; }
.potential small { display: block; color: var(--ink-3); }
.score { display: grid; grid-template-columns: 1fr 64px auto 64px 1fr; gap: .5rem; align-items: center; font-weight: 600; font-size: .92rem; }
.score span:first-child { text-align: right; }
.score input { text-align: center; font-size: 1.3rem !important; font-weight: 800; padding: .3em !important; }
.score .dash { color: var(--ink-3); }
.score.big input { font-size: 1.8rem !important; min-height: 64px !important; }
.score-fld legend { margin-bottom: .4rem; }

.ask { padding-top: .4rem; }
.ask-msg { font-size: 1.12rem; font-weight: 600; padding-right: 2.5rem; }
.btn.danger:not(.ghost) { background: var(--lose); color: #fff; }
.tour { text-align: center; padding-top: .5rem; }
.tour-emo { font-size: 3.4rem; margin-bottom: .4rem; }
.tour p { color: var(--ink-2); font-size: 1.05rem; max-width: 26em; margin: 0 auto 1rem; }
.dots { display: flex; justify-content: center; gap: .4rem; margin-bottom: 1rem; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .2s; }
.dots i.on { width: 24px; background: var(--brand); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar) + var(--safe-b) + 5rem); z-index: 60; transform: translate(-50%, 20px);
  max-width: min(92vw, 30em); padding: .75rem 1.1rem; border-radius: 14px; background: var(--ink); color: var(--bg);
  font-weight: 600; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: var(--win); color: #fff; }
.toast.bad { background: var(--lose); color: #fff; }
body[data-view="home"] .toast, body[data-view="settings"] .toast { bottom: calc(var(--safe-b) + 1.5rem); }

#update {
  position: fixed; top: calc(var(--safe-t) + .6rem); left: 50%; transform: translateX(-50%); z-index: 70;
  display: flex; align-items: center; gap: .7rem; padding: .4rem .5rem .4rem 1rem; border-radius: 99px; background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: var(--shadow);
}
#update .btn { min-height: 36px; }
#splash { display: grid; place-items: center; min-height: 100dvh; }

@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }

/* ---------- Tablette ---------- */
@media (min-width: 640px) {
  #overlay { align-items: center; padding: 1.5rem; }
  .sheet { max-width: 560px; border-radius: 24px; max-height: 88dvh; padding: 1.6rem 1.5rem 1.4rem; }
  .home-actions { grid-template-columns: 1fr 1fr; }
  .tickets { grid-template-columns: 1fr 1fr; }
  .stats { grid-template-columns: repeat(6, 1fr); }
  .cb-name { max-width: 30vw; }
  .kind-grid { grid-template-columns: 1fr 1fr 1fr; }
}

/* ---------- PC et tablette paysage : deux colonnes ---------- */
@media (min-width: 1024px) {
  body { padding-bottom: 0; }
  .tabbar { display: none; }
  .top { padding-left: 1.5rem; padding-right: 1.5rem; }
  .top-tabs { display: flex; gap: .2rem; margin-left: 1rem; }
  .top-tabs button { display: inline-flex; align-items: center; gap: .45rem; min-height: 44px; padding: 0 1rem; border: 0; border-radius: 12px; background: transparent; color: var(--ink-2); font-weight: 600; }
  .top-tabs button:hover { background: var(--paper-2); color: var(--ink); }
  .top-tabs button.on { background: var(--paper); color: var(--brand); box-shadow: var(--shadow); }
  .cb-name { max-width: 220px; }
  .shell { max-width: 1240px; padding: 0 1.5rem; }
  .shell.has-side { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 2rem; align-items: start; }
  .side { display: block; position: sticky; top: 84px; padding-top: 1rem; }
  .side .panel h3 { margin: 0; }
  .side .mini-rank { margin: .6rem 0 .8rem; }
  .fab { bottom: 1.6rem; right: 1.6rem; }
  .page { padding-bottom: 6rem; }
  .page.narrow { margin: 0; max-width: 760px; }
  .toast { bottom: 2rem; }
  .tickets { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1280px) {
  .tickets { grid-template-columns: 1fr 1fr; }
}


/* ---------- Accueil enrichi ---------- */
.home-top { display: flex; align-items: center; justify-content: space-between; margin: 0 -.4rem 1rem 0; }
.home-brand { display: inline-flex; align-items: center; gap: .5rem; font-weight: 800; font-size: 1.25rem; letter-spacing: -.03em; }
.logo-mark.small svg { width: 34px; height: 34px; }
.home .hello { margin-bottom: 1.2rem; }
.home-grid { display: grid; gap: 1.6rem; }
.home-main, .home-side { min-width: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: 1.2rem 0 .6rem; }
.sec-head h2 { font-size: 1.15rem; margin: 0; }
.home-main > .sec-head:first-child, .home-side > .sec-head:first-child { margin-top: 0; }
.circle-card.rich { align-items: flex-start; padding: .95rem 1rem; }
.circle-card.rich .cc-body { gap: .35rem; }
.faces { display: flex; }
.faces .av { margin-right: -6px; box-shadow: 0 0 0 2px var(--paper); }
.tags { display: flex; flex-wrap: wrap; gap: .3rem; }
.tag.warn { background: var(--lose-2); color: var(--lose); }
.tag.gold { background: color-mix(in srgb, var(--gold) 35%, var(--paper)); color: var(--gold-ink); }
:root[data-theme="dark"] .tag.gold { color: var(--gold); background: color-mix(in srgb, var(--gold) 18%, var(--paper)); }
.cc-bal { display: inline-flex; align-items: center; gap: .35rem; font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; align-self: center; }
.how { list-style: none; counter-reset: how; padding: 0; margin: 0 0 1.2rem; display: grid; gap: .5rem; }
.how li { counter-increment: how; display: grid; grid-template-columns: 2.2rem 1fr; column-gap: .7rem; padding: .85rem 1rem; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); }
.how li::before { content: counter(how); grid-row: span 2; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--brand-2); color: var(--brand); }
.how span { color: var(--ink-2); font-size: .92rem; }

.strip { min-width: 0; }
.strip-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: .1rem .1rem .6rem; margin: 0 -.1rem; }

<script>
"use strict";
const LANG = "en";
const BASE = "../";
/* ===== util.js ===== */
/* Pronohub — utilitaires communs */

const LOCALE = LANG === "en" ? "en-GB" : "fr-BE";
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function esc(s) {
  // Espace insécable avant la ponctuation haute française, pour éviter un « ? » seul en début de ligne
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
    .replace(/ ([?!:;»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");

/* Espaces insécables de la typographie française, pour du HTML déjà sûr */
function typo(html) { return String(html).replace(/ ([?!:;»])/g, "\u00a0$1").replace(/« /g, "«\u00a0"); }

function now() { return Date.now(); }
function dayNum(t = Date.now()) { return Math.floor(t / 86400000); }

function nf(n) { return new Intl.NumberFormat(LOCALE).format(Math.round(n || 0)); }
function pct(x) { return Math.round((x || 0) * 100) + " %"; }
function oddsFmt(x) { return "×" + (Math.round(x * 100) / 100).toFixed(2); }
function pl(n, one, many) { return Math.abs(n) > 1 ? many : one; }

function fmtDate(t, withTime = true) {
  if (!t) return "";
  const d = new Date(t);
  const o = { weekday: "short", day: "numeric", month: "short" };
  if (withTime) { o.hour = "2-digit"; o.minute = "2-digit"; }
  return d.toLocaleString(LOCALE, o);
}

function fmtTime(t) { return new Date(t).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" }); }

/* Durée relative courte : « dans 2 h », « il y a 5 min » */
function rel(t) {
  const d = t - Date.now(), a = Math.abs(d);
  const m = Math.round(a / 60000), h = Math.round(a / 3600000), j = Math.round(a / 86400000);
  let s;
  if (m < 1) return "just now";
  if (m < 60) s = m + " min";
  else if (h < 24) s = h + " h";
  else s = j + " d";
  if (d > 0) return "in " + s;
  return LANG === "en" ? s + " ago" : "il y a " + s;
}

/* Compte à rebours pour la clôture d'un pari */
function countdown(t) {
  const d = t - Date.now();
  if (d <= 0) return "";
  const m = Math.floor(d / 60000), h = Math.floor(m / 60), j = Math.floor(h / 24);
  if (j >= 2) return j + " d";
  if (h >= 1) return h + " h " + String(m % 60).padStart(2, "0");

/* Date locale pour <input type="datetime-local"> */
function toLocalInput(t) {
  const d = new Date(t), p = n => String(n).padStart(2, "0");

function rid(n = 12) {
  const a = "abcdefghijkmnpqrstuvwxyz23456789";
  let s = "";
  const r = crypto.getRandomValues(new Uint8Array(n));
  for (const x of r) s += a[x % a.length];
  return s;

/* Code de cercle lisible : ABC-123, sans caractères ambigus */
function newCode() {
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ", D = "23456789";
  const r = crypto.getRandomValues(new Uint8Array(6));

}

function normCode(s) {
  const c = String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  return c.length === 6 ? c.slice(0, 3) + "-" + c.slice(3) : "";

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

let toastTimer;

  if (!el) return;
  el.textContent = String(msg).replace(/ ([?!:;»])/g, "\u00a0$1");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast " + kind; }, 2800);

  const em = m?.avatar || "";
  return `<span class="av ${size}" style="--h:${hueOf(m?.uid || name)}" aria-hidden="true">${em ? esc(em) : esc(name.trim().charAt(0).toUpperCase())}</span>`;
}

function download(name, text, type = "application/json") {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); toast("Copied"); }
  catch (e) { prompt("Copy this text:", s); }
}

function loadScript(src) {
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = ko;
    document.head.appendChild(s);
  });
}

/* ===== store.js ===== */
/* Pronohub — stockage local (localStorage) */

const Store = {
  ns: (window.__PH_NS || "ph") + ".",
  get(k, def = null) {
    try {
      const v = localStorage.getItem(this.ns + k);
      return v == null ? def : JSON.parse(v);
    } catch (e) { return def; }
  },
  set(k, v) {
    try { localStorage.setItem(this.ns + k, JSON.stringify(v)); return true; }
    catch (e) { toast("Storage full or unavailable", "bad"); return false; }
  },
  del(k) { try { localStorage.removeItem(this.ns + k); } catch (e) { } },
  keys() {
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(this.ns)) out.push(k.slice(this.ns.length)); } } catch (e) { }
    return out;
  },
  _pending: {},
  _timer: null,
  saveSoon(k, v) {
    this._pending[k] = v;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.flush(), 300);
  },
  flush() {
    for (const [k, v] of Object.entries(this._pending)) this.set(k, v);
    this._pending = {};
  },
};
window.addEventListener("pagehide", () => Store.flush());

/* ===== fb.js ===== */
/* Pronohub — Firebase (facultatif) */

const FB = {
  ok: false,        // Firebase configuré et initialisé
  ready: false,     // première réponse d'authentification reçue
  uid: null,
  user: null,
  db: null,
  auth: null,
  error: "",
  _hooks: [],
  onAuth(fn) { this._hooks.push(fn); },

  init() {
    const cfg = window.FIREBASE_CONFIG;
    if (!window.firebase || !cfg || !cfg.apiKey) { this.ready = true; return; }
    try {
      firebase.initializeApp(cfg);
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      this.ok = true;
    } catch (e) {
      this.error = String(e.message || e);
      this.ready = true;
      return;
    }
    this.auth.onAuthStateChanged(async u => {
      if (!u) {
        try { await this.auth.signInAnonymously(); }
        catch (e) { this.error = e.code || String(e); this.ready = true; liveRender(); }
        return;
      }
      this.user = u;
      this.uid = u.uid;
      this.ready = true;
      for (const f of this._hooks) { try { await f(u); } catch (e) { console.warn(e); } }
      liveRender();
    });
    // Ne jamais rester bloqué : au bout de 8 s, on affiche l'état réel
    setTimeout(() => { if (!this.ready) { this.ready = true; this.error = this.error || "timeout"; liveRender(); } }, 8000);
  },

  /* Raccourcis */
  circle(code) { return this.db.collection("circles").doc(code); },
  sub(code, coll) { return this.circle(code).collection(coll); },
  userDoc(uid = this.uid) { return this.db.collection("users").doc(uid); },

  /* Type de connexion lisible */
  provider() {
    const u = this.user;
    if (!u) return "";
    if (u.isAnonymous) return "anon";
    const p = (u.providerData || []).map(x => x.providerId);
    if (p.includes("google.com")) return "google";
    if (p.includes("password")) return "password";
    return "other";
  },
};

/* Message d'erreur Firebase compréhensible */
function fbErr(e) {
  const c = e && (e.code || "");
  if (/permission-denied/.test(c)) return "Access denied: check that the Firestore rules are published (see FIREBASE.md).";
  if (/unavailable|network/.test(c)) return "No connection. Try again when you're online.";
  if (/wrong-password|invalid-credential|invalid-login/.test(c)) return "Wrong email or password.";
  if (/user-not-found/.test(c)) return "No account with this email.";
  if (/email-already-in-use/.test(c)) return "This email already has an account: sign in instead.";
  if (/weak-password/.test(c)) return "Password too short (6 characters minimum).";
  if (/invalid-email/.test(c)) return "Invalid email address.";
  if (/popup-blocked/.test(c)) return "Window blocked by the browser: allow pop-ups and try again.";
  if (/popup-closed|cancelled-popup/.test(c)) return "Sign-in cancelled.";
  if (/requires-recent-login/.test(c)) return "For security, sign out and back in before deleting the account.";
  if (/operation-not-allowed/.test(c)) return "This sign-in method isn't enabled in the Firebase console.";
  return "Error: " + (c || (e && e.message) || e);
}

/* ===== db.js ===== */
/* Pronohub — couche de données : un même cache pour les cercles locaux et en ligne */

const COLLS = ["members", "bets", "wagers", "ledger", "flags", "comments", "reacts"];

function blankCircle(code, local) {
  const cc = { code, local, status: "loading", err: "", circle: null, seasons: {}, seasonsLoaded: false };
  for (const c of COLLS) cc[c] = {};
  return cc;
}

const DB = {
  c: {},          // cache par code
  code: null,     // cercle ouvert
  unsub: [],
  _season: null,

  cur() { return this.code ? this.c[this.code] : null; },

  /* ---------- Ouverture ---------- */
  open(code) {
    if (this.code === code && this.cur() && this.cur().status === "ok") return;
    this.close();
    this.code = code;
    const meta = MyCircles.list().find(c => c.code === code);
    if (meta && meta.local) return this.openLocal(code);
    return this.openOnline(code);
  },

  close() {
    this.unsub.forEach(u => { try { u(); } catch (e) { } });
    this.unsub = [];
    this.code = null;
  },

  openLocal(code) {
    const cc = blankCircle(code, true);
    const d = Store.get("local." + code);
    if (!d) { cc.status = "missing"; this.c[code] = cc; return; }
    Object.assign(cc, d, { status: "ok" });
    for (const c of COLLS) cc[c] = cc[c] || {};
    cc.seasons = cc.seasons || {};
    cc.seasonsLoaded = true;
    this.c[code] = cc;
  },

  saveLocal(cc) {
    const d = { circle: cc.circle, seasons: cc.seasons };
    for (const c of COLLS) d[c] = cc[c];
    Store.saveSoon("local." + cc.code, d);
  },

  async openOnline(code) {
    const cc = blankCircle(code, false);
    this.c[code] = cc;
    if (!FB.ok) { cc.status = "nofb"; return; }
    if (!FB.uid) { cc.status = FB.ready ? "auth" : "loading"; return; }
    try {
      const snap = await FB.circle(code).get();
      if (this.code !== code) return;
      if (!snap.exists) { cc.status = "missing"; liveRender(); return; }
      cc.circle = snap.data();
      // Un non-membre n'a pas le droit de lire la fiche : un refus veut dire « pas membre »
      let isMem = false;
      try { isMem = (await FB.sub(code, "members").doc(FB.uid).get()).exists; }
      catch (e) { if (!/permission/.test(e.code || "")) throw e; }
      if (this.code !== code) return;
      if (!isMem) { cc.status = "notmember"; liveRender(); return; }
    } catch (e) {
      cc.status = /permission/.test(e.code || "") ? "denied" : "offline";
      cc.err = fbErr(e);
      liveRender();
      return;
    }
    cc.status = "ok";
    this.listen(cc);
    liveRender();
  },

  listen(cc) {
    const code = cc.code;
    const onErr = e => {
      cc.status = /permission/.test(e.code || "") ? "denied" : "offline";
      cc.err = fbErr(e);
      liveRender();
    };
    const apply = (coll) => snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === "removed") delete cc[coll][ch.doc.id];
        else cc[coll][ch.doc.id] = ch.doc.data();
      });
      queueRender();
    };
    this.unsub.push(FB.circle(code).onSnapshot(s => {
      if (!s.exists) { cc.status = "missing"; liveRender(); return; }
      cc.circle = s.data();
      MyCircles.update(code, { name: cc.circle.name, emoji: cc.circle.emoji });
      if (cc._season !== cc.circle.season) { cc._season = cc.circle.season; this.listenSeason(cc); }
      queueRender();
    }, onErr));
    this.unsub.push(FB.sub(code, "members").onSnapshot(s => {
      apply("members")(s);
      if (FB.uid && !cc.members[FB.uid] && cc.status === "ok") { cc.status = "notmember"; liveRender(); }
    }, onErr));
    for (const coll of ["flags", "reacts"]) this.unsub.push(FB.sub(code, coll).onSnapshot(apply(coll), onErr));
    this.unsub.push(FB.sub(code, "comments").orderBy("at", "desc").limit(200).onSnapshot(apply("comments"), onErr));
  },

  _seasonUnsub: [],
  listenSeason(cc) {
    this._seasonUnsub.forEach(u => u());
    this._seasonUnsub = [];
    for (const coll of ["bets", "wagers", "ledger"]) {
      cc[coll] = {};
      const u = FB.sub(cc.code, coll).where("season", "==", cc.circle.season).onSnapshot(snap => {
        snap.docChanges().forEach(ch => {
          if (ch.type === "removed") delete cc[coll][ch.doc.id];
          else cc[coll][ch.doc.id] = ch.doc.data();
        });
        queueRender();
      }, e => { cc.err = fbErr(e); cc.status = "denied"; liveRender(); });
      this._seasonUnsub.push(u);
      this.unsub.push(u);
    }
  },

  async loadSeasons(cc = this.cur()) {
    if (!cc || cc.local || cc.seasonsLoaded) return;
    try {
      const s = await FB.sub(cc.code, "seasons").get();
      s.forEach(d => { cc.seasons[d.id] = d.data(); });
      cc.seasonsLoaded = true;
      liveRender();
    } catch (e) { cc.seasonsLoaded = true; }
  },

  /* ---------- Écritures ---------- */
  async put(coll, id, data, merge = false) {
    const cc = this.cur();
    if (!cc) return false;
    if (cc.local) {
      cc[coll] = cc[coll] || {};
      cc[coll][id] = merge ? Object.assign({}, cc[coll][id], data) : data;
      this.saveLocal(cc);
      queueRender();
      return true;
    }
    try { await FB.sub(cc.code, coll).doc(id).set(data, { merge }); return true; }
    catch (e) { toast(fbErr(e), "bad"); return false; }
  },

  async del(coll, id) {
    const cc = this.cur();
    if (!cc) return false;
    if (cc.local) { delete cc[coll][id]; this.saveLocal(cc); queueRender(); return true; }
    try { await FB.sub(cc.code, coll).doc(id).delete(); return true; }
    catch (e) { toast(fbErr(e), "bad"); return false; }
  },

  async setCircle(patch) {
    const cc = this.cur();
    if (!cc) return false;
    if (cc.local) {
      Object.assign(cc.circle, patch);
      this.saveLocal(cc);
      MyCircles.update(cc.code, { name: cc.circle.name, emoji: cc.circle.emoji });
      queueRender();
      return true;
    }
    try { await FB.circle(cc.code).set(patch, { merge: true }); return true; }
    catch (e) { toast(fbErr(e), "bad"); return false; }
  },

  async putSeason(n, data) {
    const cc = this.cur();
    cc.seasons[n] = data;
    if (cc.local) { this.saveLocal(cc); return true; }
    try { await FB.sub(cc.code, "seasons").doc(String(n)).set(data); return true; }
    catch (e) { toast(fbErr(e), "bad"); return false; }
  },

  /* ---------- Création et adhésion ---------- */
  async createLocal(name, emoji, settings) {
    const code = "LOC-" + rid(4).toUpperCase();
    const p = Profile.get();
    const circle = Object.assign({ name, emoji, owner: p.id, createdAt: now(), season: 1 }, CIRCLE_DEFAULTS, settings);
    const d = { circle, seasons: {} };
    for (const c of COLLS) d[c] = {};
    d.members[p.id] = { uid: p.id, name: p.name || "Me", avatar: p.avatar || "", joinedAt: now() };
    Store.set("local." + code, d);
    MyCircles.add({ code, name, emoji, local: true });
    return code;
  },

  async createOnline(name, emoji, settings) {
    const p = Profile.get();
    let code;
    for (let i = 0; i < 6; i++) {
      code = newCode();
      const s = await FB.circle(code).get();
      if (!s.exists) break;
    }
    const circle = Object.assign({ name, emoji, owner: FB.uid, createdAt: now(), season: 1 }, CIRCLE_DEFAULTS, settings);
    await FB.circle(code).set(circle);
    await FB.sub(code, "members").doc(FB.uid).set({ uid: FB.uid, name: p.name || "Me", avatar: p.avatar || "", joinedAt: now() });
    await FB.sub(code, "private").doc("owner").set({ key: rid(10).toUpperCase() });
    MyCircles.add({ code, name, emoji, local: false });
    Account.syncCircles();
    return code;
  },

  async join(code) {
    const p = Profile.get();
    const s = await FB.circle(code).get();
    if (!s.exists) throw { code: "not-found" };
    const c = s.data();
    const ref = FB.sub(code, "members").doc(FB.uid);
    let exists = false;
    try { exists = (await ref.get()).exists; }
    catch (e) { if (!/permission/.test(e.code || "")) throw e; }
    if (!exists) await ref.set({ uid: FB.uid, name: p.name || "Player", avatar: p.avatar || "", joinedAt: now() });
    MyCircles.add({ code, name: c.name, emoji: c.emoji, local: false });
    Account.syncCircles();
    return c;
  },
};

/* Rendu groupé : plusieurs instantanés Firestore = un seul rendu */
let _rq = false;
function queueRender() {
  if (_rq) return;
  _rq = true;
  requestAnimationFrame(() => { _rq = false; liveRender(); });
}

/* ===== engine.js ===== */
/* Pronohub — moteur : cotes en pari mutuel, soldes, classement, statistiques, badges.
   Tout est recalculé à partir des données brutes : personne n'écrit le solde d'un autre. */

/* Identifiant de l'utilisateur qui agit dans le cercle ouvert */
function myId(cc = DB.cur()) {
  if (!cc) return null;
  if (cc.local) return S.actor && cc.members[S.actor] ? S.actor : Profile.get().id;
  return FB.uid;
}

/* Fusion des identités (compte anonyme rattaché à un compte Google ou e-mail) */
function aliasMap(cc) {
  const m = {};
  for (const [uid, mem] of Object.entries(cc.members)) if (mem.alias) m[mem.alias] = uid;
  return m;
}

function memberOf(cc, uid) {
  return cc.members[uid] || { uid, name: "Former member", avatar: "👻", gone: true };
}

/* Membres visibles (sans les identités anonymes fusionnées) */
function visibleMembers(cc) {
  const al = aliasMap(cc);
  return Object.entries(cc.members).filter(([uid]) => !al[uid]).map(([uid, m]) => Object.assign({ uid }, m));
}

function isOwner(cc, uid = myId(cc)) { return cc && cc.circle && cc.circle.owner === uid; }

function betSeed(b) { return b.kind === "duel" ? 0 : (b.seed ?? CIRCLE_DEFAULTS.seed); }

/* Analyse complète du cercle pour la saison en cours */
function compute(cc) {
  const season = cc.circle.season || 1;
  const al = aliasMap(cc);
  const U = uid => al[uid] || uid;
  const T = Date.now();

  const bets = {};
  const wagersByBet = {};
  for (const [id, w] of Object.entries(cc.wagers)) {
    if ((w.season || 1) !== season) continue;
    if (!cc.bets[w.bet]) continue;
    (wagersByBet[w.bet] = wagersByBet[w.bet] || []).push(Object.assign({ id }, w, { u: U(w.uid) }));
  }

  const flagsByBet = {};
  for (const f of Object.values(cc.flags)) (flagsByBet[f.bet] = flagsByBet[f.bet] || []).push(f);

  const players = {};
  // Bonus quotidien automatique et identique pour tous, depuis le début de la saison
  const days = cc.circle.daily > 0 ? Math.max(0, dayNum(T) - dayNum(cc.circle.seasonAt || cc.circle.createdAt || T)) : 0;
  const base = cc.circle.start + days * cc.circle.daily;
  const P = uid => players[uid] || (players[uid] = {
    uid, bal: base, locked: 0, staked: 0, won: 0, bets: 0, wins: 0, losses: 0,
    exact: 0, duelWins: 0, best: 0, bestOdds: 0, streak: 0, maxStreak: 0, lossStreak: 0, maxLoss: 0,
    created: 0, comments: 0, rescues: 0, biggest: 0, history: [],
  });
  for (const m of visibleMembers(cc)) P(m.uid);

  for (const l of Object.values(cc.ledger)) {
    if ((l.season || 1) !== season || l.type === "daily") continue;
    const p = P(U(l.uid));
    p.bal += l.amt;
    if (l.type === "rescue") p.rescues++;
  }
  for (const c of Object.values(cc.comments)) P(U(c.uid)).comments++;

  const settledOrder = [];

  for (const [id, b] of Object.entries(cc.bets)) {
    if ((b.season || 1) !== season) continue;
    if (cc.members[b.createdBy] || al[b.createdBy]) P(U(b.createdBy)).created++;
    const ws = wagersByBet[id] || [];
    const seed = betSeed(b);
    const byOpt = {};
    for (const o of b.options) byOpt[o.id] = 0;
    let pool = 0;
    for (const w of ws) { byOpt[w.opt] = (byOpt[w.opt] || 0) + w.amt; pool += w.amt; }
    const total = pool + seed * b.options.length;
    const odds = {};
    for (const o of b.options) {
      const d = byOpt[o.id] + seed;
      odds[o.id] = b.kind === "duel" ? 2 : d > 0 ? total / d : null;
    }
    const participants = new Set(ws.map(w => w.u));
    let state = b.status === "void" ? "void" : b.status === "settled" ? "settled" : (T >= b.closesAt ? "closed" : "open");
    let contest = 0, contestNeed = 0;
    if (state === "settled") {
      const elig = [...participants].filter(u => u !== U(b.settledBy));
      contestNeed = Math.floor(elig.length / 2) + 1;
      contest = (flagsByBet[id] || []).filter(f => f.result === b.result && elig.includes(U(f.uid))).length;
      if (elig.length && contest >= contestNeed) state = "contested";
    }
    if (b.kind === "duel" && state === "open" && ws.length < 2 && T >= b.closesAt) state = "void";

    const payouts = {};
    const info = { id, b, ws, pool, byOpt, odds, total, seed, state, payouts, participants, contest, contestNeed };
    bets[id] = info;

    if (state === "settled") {
      const winD = byOpt[b.result] + seed;
      const refund = winD === 0 || (b.kind === "duel" && ws.length < 2);
      for (const w of ws) {
        let pay = refund ? w.amt : (w.opt === b.result ? Math.floor(w.amt * total / winD) : 0);
        let bonus = 0;
        if (!refund && b.score && w.score && b.bonus && w.score.h === b.score.h && w.score.a === b.score.a) bonus = b.bonus;
        payouts[w.id] = pay + bonus;
        const p = P(w.u);
        p.bal += pay + bonus - w.amt;
        p.staked += w.amt;
        if (!refund) {
          p.bets++;
          if (bonus) p.exact++;
        }
      }
      if (!refund) settledOrder.push(info);
    } else if (state === "void") {
      for (const w of ws) payouts[w.id] = w.amt;
    } else {
      for (const w of ws) { const p = P(w.u); p.bal -= w.amt; p.locked += w.amt; p.staked += w.amt; }
    }
    for (const w of ws) { const p = P(w.u); if (w.amt > p.biggest) p.biggest = w.amt; }
  }

  // Séries et records, dans l'ordre chronologique des résultats
  settledOrder.sort((a, b) => (a.b.settledAt || 0) - (b.b.settledAt || 0));
  for (const info of settledOrder) {
    const seen = new Set();
    for (const w of info.ws) {
      if (seen.has(w.u)) continue;
      seen.add(w.u);
      const p = P(w.u);
      const gain = info.payouts[w.id] - w.amt;
      const won = w.opt === info.b.result;
      p.history.push({ bet: info.id, gain, won, at: info.b.settledAt });
      if (won) {
        p.wins++; p.won += info.payouts[w.id];
        p.streak++; p.maxStreak = Math.max(p.maxStreak, p.streak); p.lossStreak = 0;
        if (gain > p.best) p.best = gain;
        const o = info.odds[w.opt] || 0;
        if (o > p.bestOdds) p.bestOdds = o;
        if (info.b.kind === "duel") p.duelWins++;
      } else {
        p.losses++;
        p.lossStreak++; p.maxLoss = Math.max(p.maxLoss, p.lossStreak); p.streak = 0;
      }
    }
  }

  const standings = visibleMembers(cc).map(m => Object.assign({}, m, players[m.uid] || P(m.uid)))
    .sort((a, b) => b.bal - a.bal || a.name.localeCompare(b.name));
  standings.forEach((s, i) => { s.rank = i > 0 && s.bal === standings[i - 1].bal ? standings[i - 1].rank : i + 1; });

  return { bets, players, standings, season, U, daysBonus: days * cc.circle.daily };
}

/* Mémoïsation simple : un calcul par rendu */
let _cmp = null, _cmpKey = "";
function analysis(cc = DB.cur()) {
  if (!cc || !cc.circle) return null;
  const key = cc.code + ":" + _renderTick;
  if (_cmpKey !== key) { _cmp = compute(cc); _cmpKey = key; }
  return _cmp;
}

/* Gain potentiel si l'on ajoute `x` jetons sur l'option `opt` */
function potential(info, opt, x, mine) {
  const already = mine && mine.opt === opt ? mine.amt : 0;
  const total = info.total + x;
  const d = info.byOpt[opt] + info.seed + x;
  if (d <= 0) return 0;
  return Math.floor((already + x) * total / d);
}

/* Badges gagnés par un joueur */
function badgesOf(cc, a, uid) {
  const p = a.players[uid];
  if (!p) return [];
  const out = [];
  if (p.bets > 0 || p.locked > 0 || p.biggest > 0) out.push("first");
  if (p.created >= 5) out.push("creator");
  if (p.wins && p.bestOdds >= 3) out.push("nostra");
  if (p.maxStreak >= 3) out.push("streak");
  if (p.exact > 0) out.push("sniper");
  if (p.biggest >= 500) out.push("whale");
  if (p.duelWins > 0) out.push("duelist");
  if (p.comments >= 10) out.push("talk");
  if (p.rescues > 0) out.push("broke");
  if (p.maxLoss >= 5) out.push("unlucky");
  const champ = Object.values(cc.seasons || {}).some(s => s.standings && s.standings[0] && (s.standings[0].uid === uid || a.U(s.standings[0].uid) === uid));
  if (champ) out.push("champ");
  return out;
}

/* Trophées des saisons passées */
function trophiesOf(cc, a, uid) {
  const t = [];
  for (const s of Object.values(cc.seasons || {})) {
    (s.standings || []).slice(0, 3).forEach((x, i) => { if (x.uid === uid || a.U(x.uid) === uid) t.push({ season: s.n, place: i + 1 }); });
  }
  return t.sort((x, y) => x.season - y.season);
}

/* Libellé de l'option gagnante d'un pari */
function optLabel(b, id) { const o = b.options.find(o => o.id === id); return o ? o.label : "?"; }

/* Résultat d'un match à partir du score */
function matchResult(b, h, a) {
  if (h > a) return "h";
  if (h < a) return "a";
  return b.options.some(o => o.id === "d") ? "d" : null;
}

/* ===== sports.js ===== */
/* Pronohub — import des matchs et résultats depuis une source gratuite (API publique d'ESPN, non officielle).
   Si la source ne répond pas, le créateur du pari peut toujours saisir le résultat à la main. */

const Sports = {
  base: "https://site.api.espn.com/apis/site/v2/sports/",
  cache: {},
  tried: {},

  ymd(t) {
    const d = new Date(t);
    return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, "0") + String(d.getUTCDate()).padStart(2, "0");
  },

  async get(url) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  },

  parse(ev) {
    const c = (ev.competitions || [])[0] || {};
    const cs = c.competitors || [];
    const home = cs.find(x => x.homeAway === "home") || cs[0] || {};
    const away = cs.find(x => x.homeAway === "away") || cs[1] || {};
    const st = (ev.status || c.status || {}).type || {};
    const team = x => (x.team && (x.team.shortDisplayName || x.team.displayName)) || "?";
    return {
      id: String(ev.id),
      date: Date.parse(ev.date),
      home: team(home), away: team(away),
      homeLogo: (home.team && home.team.logo) || "",
      awayLogo: (away.team && away.team.logo) || "",
      state: st.state || "pre",
      completed: !!st.completed,
      statusName: st.name || "",
      sh: home.score != null ? parseInt(home.score, 10) : null,
      sa: away.score != null ? parseInt(away.score, 10) : null,
    };
  },

  ym(t) {
    const d = new Date(t);
    return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, "0");
  },

  /* Tous les matchs d'un mois (ESPN n'accepte plus les plages de dates, seulement un jour ou un mois) */
  async month(L, ym, fresh = false) {
    const key = "m:" + L.id + ":" + ym;
    const c = this.cache[key];
    if (!fresh && c && Date.now() - c.t < 10 * 60000) return c.list;
    const j = await this.get(`${this.base}${L.sport}/${L.id}/scoreboard?dates=${ym}&limit=500`);
    const list = (j.events || []).map(e => this.parse(e));
    this.cache[key] = { t: Date.now(), list };
    return list;
  },

  /* Matchs à venir d'une compétition (les `days` prochains jours) */
  async fixtures(leagueId, days = 14) {
    const L = LEAGUE[leagueId];
    const T = Date.now(), end = T + days * 86400000;
    const key = "fx:" + leagueId + ":" + days;
    const c = this.cache[key];
    if (c && T - c.t < 10 * 60000) return c.list;
    // Petit cache local d'une heure : l'accueil s'affiche tout de suite, même hors ligne
    const stored = Store.get("fx." + leagueId);
    if (!c && stored && T - stored.t < 3600000 && stored.days >= days) {
      const list = stored.list.filter(e => e.date > T && e.date < end);
      this.cache[key] = { t: stored.t, list };
      return list;
    }
    const months = [...new Set([this.ym(T), this.ym(end)])];
    const all = (await Promise.all(months.map(m => this.month(L, m)))).flat();
    const seen = new Set();
    const list = all.filter(e => e.state === "pre" && e.date > T && e.date < end && !seen.has(e.id) && seen.add(e.id))
      .sort((a, b) => a.date - b.date);
    this.cache[key] = { t: T, list };
    Store.set("fx." + leagueId, { t: T, days, list: list.map(e => ({ id: e.id, date: e.date, home: e.home, away: e.away, homeLogo: e.homeLogo, awayLogo: e.awayLogo, state: e.state })) });
    return list;
  },

  /* Résultat d'un match importé : {done, void, h, a} */
  async result(src, kickoff) {
    const L = LEAGUE[src.league];
    if (!L) return null;
    const months = [...new Set([this.ym(kickoff - 86400000), this.ym(kickoff + 86400000)])];
    const all = (await Promise.all(months.map(m => this.month(L, m, true)))).flat();
    const m = all.find(e => e.id === String(src.event));
    if (!m) return null;
    if (/POSTPONED|CANCELED|CANCELLED|ABANDONED|SUSPENDED/.test(m.statusName)) return { done: true, void: true };
    if (m.completed && m.sh != null && m.sa != null) return { done: true, h: m.sh, a: m.sa };
    return { done: false };
  },

  /* Règlement automatique des paris importés dont le match est terminé */
  async autoSettle() {
    const cc = DB.cur();
    if (!cc || cc.status !== "ok" || !cc.circle) return;
    const T = Date.now();
    for (const [id, b] of Object.entries(cc.bets)) {
      if (!b.src || b.status !== "open" || (b.season || 1) !== cc.circle.season) continue;
      if (T < b.closesAt + 100 * 60000) continue;
      if (this.tried[id] && T - this.tried[id] < 10 * 60000) continue;
      this.tried[id] = T;
      try {
        const r = await this.result(b.src, b.closesAt);
        if (!r || !r.done || DB.code !== cc.code) continue;
        if (r.void) {
          await DB.put("bets", id, { status: "void", settledBy: "auto", settledAt: Date.now() }, true);
          continue;
        }
        const res = matchResult(b, r.h, r.a);
        if (!res) await DB.put("bets", id, { status: "void", score: { h: r.h, a: r.a }, settledBy: "auto", settledAt: Date.now() }, true);
        else await DB.put("bets", id, { status: "settled", result: res, score: { h: r.h, a: r.a }, settledBy: "auto", settledAt: Date.now() }, true);
      } catch (e) { /* source indisponible : on réessaiera plus tard */ }
    }
  },
};

/* Pronohub — compte : anonyme par défaut, Google ou e-mail facultatif */

const Account = {
  async onAuth(u) {
    // Récupère le profil et la liste des cercles enregistrés sur le compte
    try {
      const s = await FB.userDoc().get();
      const p = Profile.get();
      if (s.exists) {
        Solo.mergeRemote(s.data().solo);
        const d = s.data();
        if (d.name && !p.name) Profile.set({ name: d.name, avatar: d.avatar || "" });
        for (const c of d.circles || []) if (!MyCircles.has(c.code)) MyCircles.add(Object.assign({}, c, { local: false }));
      }
      this.syncCircles();
      Solo._sum = ""; Solo.syncSoon();
    } catch (e) { /* hors ligne : on garde la liste locale */ }
  },

  syncCircles: debounce(async function () {
    if (!FB.ok || !FB.uid) return;
    const p = Profile.get();
    const circles = MyCircles.list().filter(c => !c.local).map(c => ({ code: c.code, name: c.name, emoji: c.emoji || "🎯" }));
    try { await FB.userDoc().set({ name: p.name || "", avatar: p.avatar || "", circles, updatedAt: now() }, { merge: true }); }
    catch (e) { }
  }, 800),

  /* Met à jour mon nom/avatar dans tous mes cercles en ligne */
  async pushProfile() {
    const p = Profile.get();
    this.syncCircles();
    if (!FB.ok || !FB.uid) return;
    for (const c of MyCircles.list().filter(c => !c.local)) {
      try { await FB.sub(c.code, "members").doc(FB.uid).set({ name: p.name, avatar: p.avatar || "" }, { merge: true }); } catch (e) { }
    }
  },

  async linkGoogle() {
    const prov = new firebase.auth.GoogleAuthProvider();
    try {
      await FB.auth.currentUser.linkWithPopup(prov);
      await FB.auth.currentUser.reload();
      FB.user = FB.auth.currentUser;
      toast("Google account linked: your bets follow you everywhere", "good");
    } catch (e) {
      if (e.code === "auth/credential-already-in-use" && e.credential) {
        await this.switchTo(() => FB.auth.signInWithCredential(e.credential)).catch(err => toast(fbErr(err), "bad"));
      } else toast(fbErr(e), "bad");
    }
    S.modal = null; render();
  },

  async email(mode, email, pass) {
    try {
      if (mode === "create") {
        const cred = firebase.auth.EmailAuthProvider.credential(email, pass);
        await FB.auth.currentUser.linkWithCredential(cred);
        await FB.auth.currentUser.reload();
        FB.user = FB.auth.currentUser;
        toast("Account created", "good");
      } else {
        await this.switchTo(() => FB.auth.signInWithEmailAndPassword(email, pass));
      }
      S.modal = null; render();
    } catch (e) {
      if (e.code === "auth/email-already-in-use" || e.code === "auth/credential-already-in-use") {
        S.modal = Object.assign({}, S.modal, { mode: "login", err: "This email already has an account: enter your password to sign in." });
      } else S.modal = Object.assign({}, S.modal, { err: fbErr(e) });
      render();
    }
  },

  /* Bascule sur un compte existant en emportant ce qui appartenait à l'identité anonyme.
     Preuve : un secret stocké dans claims/{ancienUid}, lisible seulement par l'ancienne identité,
     recopié dans la fiche membre et vérifié par les règles Firestore. */
  async switchTo(signIn) {
    const old = FB.uid;
    const wasAnon = FB.user && FB.user.isAnonymous;
    const secret = rid(24);
    const circles = MyCircles.list().filter(c => !c.local);
    if (wasAnon && circles.length) {
      try { await FB.db.collection("claims").doc(old).set({ secret, at: now() }); } catch (e) { }
    }
    DB.close();
    let res;
    try { res = await signIn(); }
    catch (e) { if (S.code) DB.open(S.code); throw e; }
    if (res && res.user) { FB.user = res.user; FB.uid = res.user.uid; }
    const p = Profile.get();
    for (const c of circles) {
      try {
        const ref = FB.sub(c.code, "members").doc(FB.uid);
        const data = { uid: FB.uid, name: p.name || "Player", avatar: p.avatar || "" };
        const ex = await ref.get();
        if (!ex.exists) data.joinedAt = now();
        if (wasAnon && (!ex.exists || !ex.data().alias)) { data.alias = old; data.aliasKey = secret; }
        await ref.set(data, { merge: true });
      } catch (e) { }
    }
    if (wasAnon && circles.length) { try { await FB.db.collection("claims").doc(old).delete(); } catch (e) { } }
    this.syncCircles();
    toast("Signed in: your circles are linked to your account", "good");
    if (S.code) DB.open(S.code);
  },

  async signOut() {
    if (!(await ask("Sign out? On this device, you'll start again with a blank anonymous identity.", "Sign out"))) return;
    DB.close();
    await FB.auth.signOut();
    MyCircles.save(MyCircles.list().filter(c => c.local));
    S.code = null; S.view = "home"; S.modal = null;
    toast("Signed out");
    render();
  },

  async deleteAccount() {
    if (!(await ask("Delete your account? You'll leave all your online circles and your profile will be erased. This is permanent.", "Delete my account", true))) return;
    try {
      for (const c of MyCircles.list().filter(c => !c.local)) {
        try {
          const cs = await FB.circle(c.code).get();
          if (cs.exists && cs.data().owner === FB.uid) continue; // un cercle ne peut pas rester sans propriétaire
          await FB.sub(c.code, "members").doc(FB.uid).delete();
        } catch (e) { }
      }
      await FB.userDoc().delete();
      await FB.auth.currentUser.delete();
      for (const k of Store.keys()) if (!k.startsWith("local.") && k !== "prefs") Store.del(k);
      MyCircles.save(MyCircles.list().filter(c => c.local));
      DB.close();
      S.code = null; S.view = "home"; S.modal = null;
      toast("Account deleted");
    } catch (e) { toast(fbErr(e), "bad"); }
    render();
  },

  modal() {
    const m = S.modal;
    if (!FB.ok) {
      return `<h2>Account</h2>
        <p class="muted">Accounts and online circles aren't enabled on this installation yet. Your “on this device” circles work as usual.</p>
        <div class="row end"><button class="btn" data-a="close">Close</button></div>`;
    }
    const prov = FB.provider();
    if (m.mode === "email" || m.mode === "login") {
      const login = m.mode === "login";
      return `<h2>${login ? "Sign in with email" : "Create an email account"}</h2>
        ${m.err ? `<p class="err">${esc(m.err)}</p>` : ""}
        <form data-f="email" data-mode="${login ? "login" : "create"}" class="stack">
          <label class="fld"><span>Email</span><input type="email" name="email" autocomplete="email" required value="${esc(m.email || "")}"></label>
          <label class="fld"><span>Password</span><input type="password" name="pass" minlength="6" autocomplete="${login ? "current-password" : "new-password"}" required></label>
          <div class="row end">
            <button type="button" class="btn ghost" data-a="accMode" data-mode="${login ? "email" : "login"}">${login ? "Create an account" : "I already have an account"}</button>
            <button class="btn primary">${login ? "Sign in" : "Create account"}</button>
          </div>
        </form>`;
    }
    const who = prov === "anon"
      ? `<p>You're playing with an <b>anonymous identity</b> tied to this device. Create an account to get your circles on your phone, tablet and computer.</p>`
      : `<p>Signed in with <b>${prov === "google" ? "Google" : "an email"}</b>${FB.user && FB.user.email ? ` (${esc(FB.user.email)})` : ""}. Your circles follow you on all your devices.</p>`;
    return `<h2>Account</h2>
      ${who}
      ${prov === "anon" ? `<div class="stack">
        <button class="btn primary wide" data-a="accGoogle"><span class="g">G</span> Continue with Google</button>
        <button class="btn wide" data-a="accMode" data-mode="email">Continue with email</button>
      </div>` : `<div class="stack">
        <button class="btn wide" data-a="accSignOut">Sign out</button>
        <button class="btn danger wide" data-a="accDelete">Delete my account</button>
      </div>`}
      <div class="row end"><button class="btn ghost" data-a="close">Close</button></div>`;
  },
};

function accountAct(a, d) {
  switch (a) {
    case "account": S.modal = { k: "account" }; return true;
    case "accMode": S.modal = { k: "account", mode: d.mode }; return true;
    case "accGoogle": Account.linkGoogle(); return true;
