function effOdd(base, o, atouts = []) {
  let x = base;
  const has = id => atouts.includes(id);
  if (o === "d" && has("nul")) x *= 1.5;
  if (o === "h" && has("domicile")) x *= 1.2;
  if (o === "a" && has("remontada")) x *= 1.3;
  if (base < 1.7 && has("favori")) x += 0.25;
  return Math.round(x * 100) / 100;
}
function ticketOdd(sel, ctx) {
  let x = 1;
  for (const s of sel) { const g = ctx.gmap[s.g]; x *= ctx.eff(g.odds[s.o], s.o); }
  if (ctx.accu && sel.length >= 3) x *= 1.3;
  return Math.round(x * 100) / 100;
}
function selLabel(g, o) { return o === "h" ? g.h : o === "a" ? g.a : `Draw ${g.h}–${g.a}`; }

function runCtx(run) {
  const has = id => run.atouts.includes(id);
  const staked = run.tickets.reduce((s, t) => s + t.stake, 0);
  return {
    kind: "run", games: run.data.games, gmap: Object.fromEntries(run.data.games.map(g => [g.id, g])), tickets: run.tickets,
    max: run.boss === "one" ? 1 : has("ticket") ? 4 : 3, available: run.bank - staked,
    eff: (b, o) => effOdd(b, o, run.atouts), accu: has("accu"),
    minStake: run.boss === "allin" ? Math.ceil(run.startBank / 2) : 1, simple: run.boss === "simple", minOdd: run.boss === "outsider" ? 2.2 : 0,
    locked: () => false,
  };
}
function dailyCtx(d) {
  const staked = d.tickets.reduce((s, t) => s + t.stake, 0);
  return {
    kind: "daily", games: d.games, gmap: Object.fromEntries(d.games.map(g => [g.id, g])), tickets: d.tickets, max: 3,
    available: SOLO_START - staked, eff: b => b, accu: false, minStake: 1, simple: false, minOdd: 0,
    locked: g => g.t <= Date.now() + 60000,
  };
}
function curCtx() {
  const st = Solo.s();
  if (S.soloView === "run" && st.run && st.run.phase === "bet" && st.run.data) return runCtx(st.run);
  if (S.soloView === "daily" && Daily.cur()) return dailyCtx(Daily.cur());
  return null;
}

/* ---------- Parcours ---------- */
function bossFor(run, idx) { return BOSS_AT.includes(idx) ? BOSSES[Math.floor(rng(run.seed * 7 + idx)() * BOSSES.length)].id : null; }

async function stageGen(run, idx, retry = 0) {
  const r = rng(run.seed + idx * 977 + retry * 31);
  const lgs = Solo.leagues();
  return Odds.retroStage(lgs[Math.floor(r() * lgs.length)], r);
}

function newRun() {
  const st = Solo.s();
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const r = rng(seed);
  st.run = {
    seed, stage: 0, bank: SOLO_START, startBank: SOLO_START, fiches: 0, atouts: [], streak: 0, phase: "draft", tickets: [],
    offer: shuffle(Solo.pool().filter(a => a.r === 1), r).slice(0, 3).map(a => a.id), rerolls: 0,
    stats: { won: 0, bestOdd: 0, maxBank: SOLO_START, cleared: 0 }, startedAt: now(),
  };
  Solo.save();
  stageGen(st.run, 0).then(data => { if (st.run && st.run.stage === 0 && !st.run.data) { st.run.next = { idx: 0, data }; Solo.save(); } }).catch(() => { });
}

async function loadStage() {
  const run = Solo.s().run;
  if (!run || run.loading) return;
  run.phase = "loading"; run.loadErr = false;
  if (run.next && run.next.idx === run.stage) {
    run.data = run.next.data; run.next = null;
  } else {
    run.loading = true; render();
    try { run.data = await stageGen(run, run.stage, run.retry || 0); }
    catch (e) { run.loadErr = true; run.retry = (run.retry || 0) + 1; run.loading = false; render(); return; }
    run.loading = false;
  }
  run.boss = bossFor(run, run.stage);
  run.tickets = []; run.startBank = run.bank; run.phase = "bet"; run.last = null;
  S.draft = null;
  Solo.save();
  render();
  window.scrollTo(0, 0);
}

async function prepareNext() {
  const run = Solo.s().run;
  const idx = run.stage + 1;
  if (idx >= OBJ.length || (run.next && run.next.idx === idx) || run.preparing) return;
  run.preparing = true;
  try { run.next = { idx, data: await stageGen(run, idx) }; Solo.save(); } catch (e) { }
  run.preparing = false;
}

function playStage() {
  const run = Solo.s().run, has = id => run.atouts.includes(id);
  const gmap = Object.fromEntries(run.data.games.map(g => [g.id, g]));
  const staked = run.tickets.reduce((s, t) => s + t.stake, 0);
  let streak = run.streak, filetUsed = false, won = 0;
  const res = run.tickets.map(t => {
    const wrong = t.sel.filter(s => gameResult(gmap[s.g]) !== s.o).length;
    let pay = 0, note = "";
    if (!wrong) {
      let gain = t.stake * t.odd - t.stake, mult = 1;
      if (has("outsider") && t.sel.some(s => s.base >= 3)) { mult *= 1.5; note = "outsider"; }
      if (has("feu") && streak) mult *= 1 + 0.1 * streak;
      gain = Math.floor(gain * mult);
      pay = t.stake + gain; streak++; won++;
      run.stats.bestOdd = Math.max(run.stats.bestOdd, t.odd);
      if (t.odd >= 5) Solo.award("poker");
      if (t.sel.length >= 4) Solo.award("combo4");
    } else {
      streak = 0;
      if (has("assurance") && t.sel.length >= 2 && wrong === 1) { pay = t.stake; note = "assurance"; }
      else if (has("filet") && !filetUsed) { pay = Math.floor(t.stake / 2); filetUsed = true; note = "filet"; }
    }
    return { pay, won: !wrong, note };
  });
  if (has("double")) {
    let bi = -1, bg = 0;
    res.forEach((r, i) => { const g = r.pay - run.tickets[i].stake; if (r.won && g > bg) { bg = g; bi = i; } });
    if (bi >= 0) { res[bi].pay += bg; res[bi].note = "double"; }
  }
  const before = run.bank;
  const tirelire = has("tirelire") ? Math.min(50, Math.floor((before - staked) * 0.1)) : 0;
  run.bank = before - staked + res.reduce((s, r) => s + r.pay, 0) + tirelire;
  run.streak = streak;
  run.stats.won += won;
  run.stats.maxBank = Math.max(run.stats.maxBank, run.bank);
  if (streak >= 5) Solo.award("streak5");
  if (run.bank >= 2000) Solo.award("rich");
  const obj = OBJ[run.stage];
  let cleared = run.bank >= obj, second = false;
  if (!cleared && has("relance") && run.bank > 0) { cleared = true; second = true; run.atouts = run.atouts.filter(a => a !== "relance"); }
  const fiches = [];
  if (cleared) {
    fiches.push(["Stage cleared", 3]);
    if (run.boss) fiches.push(["Boss stage", 3]);
    if (won) fiches.push([`${won} ${pl(won, "ticket won", "tickets won")}`, won * (has("collection") ? 2 : 1)]);
    const surplus = Math.min(3, Math.floor((run.bank / obj - 1) / 0.25));
    if (surplus > 0) fiches.push(["Target beaten", surplus]);
    if (has("prime")) fiches.push(["Stage bonus", 2]);
    run.fiches += fiches.reduce((s, f) => s + f[1], 0);
    run.stats.cleared++;
    if (run.stats.cleared >= 4) Solo.award("half");
  }
  run.last = { before, after: run.bank, obj, res, tirelire, cleared, second, fiches };
  run.phase = "reveal";
  Solo.played();
  Solo.save();
  S.soloAnim = true;
  setTimeout(() => { S.soloAnim = false; }, 4000);
}

function shopOffer(run) {
  const r = rng(run.seed + run.stage * 131 + run.rerolls * 17);
  const pool = Solo.pool().filter(a => !run.atouts.includes(a.id));
  const bag = [];
  for (const a of pool) for (let k = 0; k < 4 - a.r; k++) bag.push(a.id);
  const out = [];
  for (const id of shuffle(bag, r)) { if (!out.includes(id)) out.push(id); if (out.length === 3) break; }
  return out;
}

function endRun(won) {
  const st = Solo.s(), run = st.run;
  const gain = run.stats.cleared * 15 + (won ? 60 : 0) + run.stats.won * 2 + (run.stats.bestOdd >= 5 ? 10 : 0);
  const lv = Solo.addRep(gain);
  st.runs++;
  st.best = Math.max(st.best, run.stats.cleared);
  if (won) st.wins++;
  Solo.award("run1");
  if (won) Solo.award("perfect");
  const unlocks = [];
  for (let l = lv.before + 1; l <= lv.after; l++) unlocks.push(...Solo.unlocksAt(l));
  run.phase = "end";
  run.result = { won, gain, before: lv.before, after: lv.after, unlocks };
  run.next = null;
  Solo.save();
}

/* ---------- Défi du jour ---------- */
const Daily = {
  busy: false, err: false, board: null, boardAt: 0, refAt: 0,
  cur() { return Solo.s().daily[Solo.today()]; },
  async prepare() {
    const st = Solo.s(), day = Solo.today();
    if (st.daily[day] || this.busy) return;
    this.busy = true; this.err = false; queueRender();
    try {
      const games = await Odds.daily(day, startOfDay(Date.now()));
      st.daily[day] = { day, games, tickets: [], bank: SOLO_START, done: false };
      const old = Solo.today(Date.now() - 7 * 86400000);
      for (const k of Object.keys(st.daily)) if (k < old) delete st.daily[k];
      Solo.save();
    } catch (e) { this.err = true; }
    this.busy = false;
    queueRender();
  },
  async refresh(force) {
    const d = this.cur();
    if (!d || d.done) return;
    if (!force && Date.now() - this.refAt < 60000) return;
    this.refAt = Date.now();
    const T = Date.now();
    const need = d.games.filter(g => !g.c && !g.v && g.t < T - 100 * 60000);
    for (const k of [...new Set(need.map(g => g.lg + "|" + Sports.ym(g.t)))]) {
      const [lg, ym] = k.split("|");
      try {
        const list = await Odds.month(lg, ym, 5 * 60000);
        for (const g of need) {
          const m = list.find(x => x.i === g.id);
          if (!m) continue;
          if (m.v) g.v = 1;
          else if (m.c) { g.x = m.x; g.y = m.y; g.c = 1; }
        }
      } catch (e) { }
    }
    this.settle();
    queueRender();
  },
  settle() {
    const d = this.cur();
    if (!d) return;
    const gmap = Object.fromEntries(d.games.map(g => [g.id, g]));
    let changed = false;
    for (const t of d.tickets) {
      if (t.res) continue;
      const rs = t.sel.map(s => gameResult(gmap[s.g]));
      if (rs.some(x => x === null)) continue;
      let odd = 1, wrong = 0;
      t.sel.forEach((s, i) => { if (rs[i] === "void") return; if (rs[i] === s.o) odd *= s.odd; else wrong++; });
      t.res = wrong ? "lost" : "won";
      t.pay = wrong ? 0 : Math.floor(t.stake * odd);
      changed = true;
      if (!wrong) { Solo.addRep(5); if (odd >= 5) Solo.award("poker"); }
    }
    const staked = d.tickets.reduce((s, t) => s + t.stake, 0);
    d.bank = SOLO_START - staked + d.tickets.reduce((s, t) => s + (t.pay || 0), 0);
    const T = Date.now();
    const canStill = d.tickets.length < 3 && SOLO_START - staked > 0 && d.games.some(g => g.t > T + 60000);
    if (!d.done && d.tickets.length && d.tickets.every(t => t.res) && !canStill) {
      d.done = true; changed = true;
      const st = Solo.s();
      st.dailyCount++;
      Solo.addRep(10);
      Solo.award("daily1");
      if (st.dailyCount >= 7) Solo.award("daily7");
    }
    if (changed) Solo.save();
  },
  pending(d) { return d.tickets.filter(t => !t.res).reduce((s, t) => s + t.stake, 0); },
  async loadBoard() {
    if (!FB.ok || !FB.uid || Date.now() - this.boardAt < 60000) return;
    this.boardAt = Date.now();
    const seen = {}, day = Solo.today();
    for (const c of MyCircles.list().filter(c => !c.local)) {
      try {
        const snap = await FB.sub(c.code, "members").get();
        snap.forEach(doc => { const m = doc.data(); if (m.solo && m.solo.day === day) seen[doc.id] = Object.assign({ uid: doc.id, name: m.name, avatar: m.avatar }, m.solo); });
      } catch (e) { }
    }
    this.board = Object.values(seen).sort((a, b) => b.bank - a.bank);
    queueRender();
  },
};

function formLabel(f) {
  const n = { W: 0, D: 0, L: 0 };
  for (const c of f) n[c]++;
  return `Form: ${n.W} ${pl(n.W, "win", "wins")}, ${n.D} ${pl(n.D, "draw", "draws")}, ${n.L} ${pl(n.L, "loss", "losses")}`;
}
function formDots(f) {
  if (!f) return "";
  return `<span class="form" role="img" aria-label="${esc(formLabel(f))}">${[...f].map(c => `<i class="f${c}"></i>`).join("")}</span>`;
}

function gameCard(g, o) {
  const L = LEAGUE[g.lg];
  const res = gameResult(g);
  const keys = L.draw ? ["h", "d", "a"] : ["h", "a"];
  const lab = { h: "1", d: "X", a: "2" };
  const locked = o.locked && o.locked(g);
  let right = "";
  if ((o.show || locked) && g.c && g.x != null) right = `<b class="g-score" style="--i:${o.i || 0}">${g.x}–${g.y}</b>`;
  else if (g.v) right = `<span class="tag">Cancelled</span>`;
  else if (locked) right = `<span class="tag">Started</span>`;
  return `<article class="gcard ${locked ? "locked" : ""} ${o.picked ? "has-pick" : ""}">
    <div class="g-top"><span>${o.league ? `${CAT[L.cat].e} ${esc(L.name)}, ` : ""}${fmtDate(g.t)}</span>${right}</div>
    <div class="g-team">${teamLogo(Odds.logo(g.hl), g.h)}<b>${esc(g.h)}</b>${formDots(g.fh)}</div>
    <div class="g-team">${teamLogo(Odds.logo(g.al), g.a)}<b>${esc(g.a)}</b>${formDots(g.fa)}</div>
    <div class="g-odds n${keys.length}">${keys.map(k => {
      const cls = [o.picked === k ? "on" : "", o.placed && o.placed.has(k) ? "placed" : "", (o.show || locked) && res === k ? "win" : "", o.show && res && res !== k && o.placed && o.placed.has(k) ? "miss" : ""].join(" ");
      const odd = o.eff ? o.eff(g.odds[k], k) : g.odds[k];
      const boosted = odd !== g.odds[k];
      return `<button class="odd ${cls}" data-a="pick" data-g="${esc(g.id)}" data-o="${k}" ${o.show || locked ? "disabled" : ""} aria-pressed="${o.picked === k}"><span>${lab[k]}</span><b class="${boosted ? "boost" : ""}">${oddsFmt(odd)}</b></button>`;
    }).join("")}</div>
  </article>`;
}

function gameList(ctx, extra = {}) {
  const draft = S.draft && S.draft.kind === ctx.kind ? S.draft : null;
  return `<div class="glist">${ctx.games.map((g, i) => {
    const placed = new Set(ctx.tickets.flatMap(t => t.sel.filter(s => s.g === g.id).map(s => s.o)));
    const p = draft && draft.sel.find(s => s.g === g.id);
    return gameCard(g, Object.assign({ picked: p ? p.o : null, placed, eff: ctx.eff, locked: ctx.locked, i }, extra));
  }).join("")}</div>`;
}

function slipView(ctx) {
  const d = S.draft;
  if (!d || d.kind !== ctx.kind || !d.sel.length) return "";
  const odd = ticketOdd(d.sel, ctx), avail = Math.max(0, ctx.available);

  return `<form class="slip" data-f="ticket">
    <div class="slip-sel">${d.sel.map(s => {
      const g = ctx.gmap[s.g];
      return `<span class="sel">${esc(selLabel(g, s.o))} <b>${oddsFmt(ctx.eff(g.odds[s.o], s.o))}</b><button type="button" class="x" data-a="unpick" data-g="${esc(s.g)}" aria-label="Remove this pick">${ICON.x}</button></span>`;
    }).join("")}</div>
    <div class="slip-row">
      <span class="slip-odd"><small>${d.sel.length > 1 ? `Parlay of ${d.sel.length}` : "Single"}${ctx.accu && d.sel.length >= 3 ? ", accumulator" : ""}</small><b>${oddsFmt(odd)}</b></span>
      <label class="slip-stake"><small>Stake</small><input name="slipStake" type="number" inputmode="numeric" min="${ctx.minStake}" max="${avail}" value="${stake}" data-odd="${odd}"></label>

    <button class="btn primary wide big" ${avail < 1 ? "disabled" : ""}>Place ticket, payout <span id="slipGain">${nf(Math.floor(stake * odd))}</span></button>

function runHead(run, bank = run.bank, shop = false) {

function stageLabel(data) {
  const L = LEAGUE[data.lg];

function runView() {

/* ---------- Actions ---------- */
function soloAct(a, d) {
  const st = Solo.s(), run = st.run;
  switch (a) {
    case "soloHub": go("solo", { soloView: "hub" }); return "keep";
    case "soloNewRun": newRun(); S.draft = null; if (S.view === "solo") { S.soloView = "run"; window.scrollTo(0, 0); return true; } go("solo", { soloView: "run" }); return "keep";
    case "soloRun":
      if (!run || run.phase === "end") newRun();
      go("solo", { soloView: "run" }); return "keep";
    case "soloDaily": go("solo", { soloView: "daily" }); return "keep";
    case "dailyRetry": Daily.err = false; Daily.prepare(); return true;
    case "retryStage": run.loadErr = false; loadStage(); return true;
    case "draftPick": run.atouts = [d.id]; loadStage(); return true;
    case "abandonRun":
      ask("Give up this Run? You keep the reputation from the stages already cleared.", "Give up", true).then(ok => {
        if (!ok) return;
        if (run.stage === 0 && !run.stats.cleared && run.phase !== "reveal") { st.run = null; Solo.save(); S.soloView = "hub"; }
        else endRun(false);
        render();
      });
      return true;
    case "pick": {
      const ctx = curCtx();
      if (!ctx) return true;
      const g = ctx.gmap[d.g];
      if (!g || ctx.locked(g)) return true;
      if (ctx.tickets.length >= ctx.max) { toast("You've placed all your tickets"); return true; }
      if (ctx.minOdd && g.odds[d.o] < ctx.minOdd) { toast("Boss stage: minimum odds 2.20"); return true; }
      if (!S.draft || S.draft.kind !== ctx.kind) S.draft = { kind: ctx.kind, sel: [], stake: null };
      const sel = S.draft.sel, i = sel.findIndex(s => s.g === d.g);
      if (i >= 0 && sel[i].o === d.o) sel.splice(i, 1);
      else if (i >= 0) sel[i].o = d.o;
      else {
        if (ctx.simple) sel.length = 0;
        if (sel.length >= 4) { toast("4 matches at most per ticket"); return true; }
        sel.push({ g: d.g, o: d.o });
      }
      return true;
    }
    case "unpick": if (S.draft) S.draft.sel = S.draft.sel.filter(s => s.g !== d.g); return true;
    case "slipFrac": {
      const ctx = curCtx(), inp = $('form[data-f="ticket"] input[name="slipStake"]');
      if (!ctx || !inp) return "keep";
      inp.value = Math.max(ctx.minStake, Math.min(ctx.available, Math.round(ctx.available * parseFloat(d.v))));
      updateSlip();
      return "keep";
    }
    case "delTicket": {
      const ctx = curCtx();
      if (!ctx) return true;
      ctx.tickets.splice(+d.i, 1);
      Solo.save();
      return true;
    }
    case "playStage": {
      const go2 = () => { playStage(); window.scrollTo(0, 0); render(); };
      if (!run.tickets.length) ask("Play the stage with no ticket? Your tokens won't change.", "Play anyway").then(ok => ok && go2());
      else if (S.draft && S.draft.sel.length) ask("Your current ticket isn't placed. Play the stage anyway?", "Play the stage").then(ok => { if (ok) { S.draft = null; go2(); } });
      else go2();
      return "keep";
    }
    case "toShop":
      run.phase = "shop"; run.rerolls = 0; run.offer = shopOffer(run); Solo.save();
      prepareNext();
      window.scrollTo(0, 0);
      return true;
    case "toEnd": endRun(run.last && run.last.cleared); window.scrollTo(0, 0); return true;
    case "shopBuy": {
      const at = ATOUT[d.id], price = PRICE[at.r];
      if (run.atouts.length >= 4) { toast("4 perks at most: sell one first", "bad"); return true; }
      if (run.fiches < price) return true;
      run.fiches -= price; run.atouts.push(d.id); run.offer = run.offer.filter(x => x !== d.id);
      if (run.atouts.length >= 4) Solo.award("full");
      toast(`${at.e} ${at.name} joins your hand`, "good");
      Solo.save();
      return true;
    }
    case "shopSell": run.fiches += Math.floor(PRICE[ATOUT[d.id].r] / 2); run.atouts = run.atouts.filter(x => x !== d.id); Solo.save(); return true;
    case "shopReroll": {
      const cost = 2 + run.rerolls;
      if (run.fiches < cost) return true;
      run.fiches -= cost; run.rerolls++; run.offer = shopOffer(run); Solo.save();
      return true;
    }
    case "nextStage": run.stage++; run.phase = "loading"; S.draft = null; loadStage(); return true;
  }
  return false;
}

function soloSubmit(f, fd) {
  if (f.dataset.f !== "ticket") return false;
  const ctx = curCtx();
  if (!ctx || !S.draft || !S.draft.sel.length) return true;
  const stake = parseInt(fd.get("slipStake"), 10);
  if (!(stake >= 1)) { toast("Stake at least 1 token", "bad"); return true; }
  if (stake < ctx.minStake) { toast(`Boss stage: stake at least ${nf(ctx.minStake)} tokens`, "bad"); return true; }
  if (stake > ctx.available) { toast(`You only have ${nf(ctx.available)} tokens`, "bad"); return true; }
  if (S.draft.sel.some(s => ctx.locked(ctx.gmap[s.g]))) { toast("One of the matches has already started", "bad"); return true; }
  const sel = S.draft.sel.map(s => { const g = ctx.gmap[s.g]; return { g: s.g, o: s.o, base: g.odds[s.o], odd: ctx.eff(g.odds[s.o], s.o) }; });
  ctx.tickets.push({ sel, stake, odd: ticketOdd(S.draft.sel, ctx), at: now() });
  S.draft = null;
  if (ctx.kind === "daily") { Solo.played(); Daily.settle(); }
  Solo.save();
  toast("Ticket placed", "good");
  return true;
}

  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  ticket: svg('<path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/>'),
  trophy: svg('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  chat: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  send: svg('<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'),
  coin: `<span class="coin" aria-hidden="true"></span>`,
  users: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>'),
};

const TICKET_SVG = `<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <path d="M10 14h44a4 4 0 0 1 4 4v8a6 6 0 0 0 0 12v8a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4v-8a6 6 0 0 0 0-12v-8a4 4 0 0 1 4-4z" fill="var(--brand)"/>
  <path d="M42 18v28" stroke="var(--paper)" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="24" cy="32" r="9" fill="var(--gold)"/><circle cx="24" cy="32" r="5.5" fill="none" stroke="var(--gold-ink)" stroke-width="2"/>
</svg>`;

/* ---------- Navigation ---------- */
function go(view, params = {}) {
  Object.assign(S, params, { view, modal: null });
  try { history.pushState({ view, ...params }, ""); } catch (e) { }
  render();
  window.scrollTo(0, 0);
}
function goBack() {
  if (history.state && history.state.view) history.back();
  else { S.view = S.code ? "circle" : "home"; render(); }
}
window.addEventListener("popstate", e => {
  const st = e.state || {};
  S.modal = null;
  if (st.view) Object.assign(S, st);
  else S.view = S.code ? "circle" : "home";
  render();
});

/* ---------- Rendu ---------- */
function topBar(cc, a) {
  const me = myId(cc), p = a.players[me];
  const c = cc.circle;
  const tabs = [["bets", "Bets", ICON.ticket], ["rank", "Standings", ICON.trophy], ["feed", "Feed", ICON.chat], ["me", "Me", ICON.user]];
  return `<header class="top">
    <button class="circle-btn" data-a="switcher" aria-label="Switch circle">
      <span class="cb-emo" aria-hidden="true">${esc(c.emoji || "🎯")}</span><span class="cb-name">${esc(c.name)}</span>${ICON.down}
    </button>
    <nav class="top-tabs" aria-label="Sections">${tabs.map(([k, l, i]) => `<button class="${S.view === "circle" && S.tab === k ? "on" : ""}" data-a="tab" data-v="${k}">${i}<span>${l}</span></button>`).join("")}</nav>
    <div class="top-right">
      ${cc.local ? `<button class="actor-chip" data-a="actor" aria-label="Switch player">${avatar(memberOf(cc, me), "sm")}<span>${esc(memberOf(cc, me).name)}</span></button>` : ""}
      <button class="coin-chip" data-a="tab" data-v="me" aria-label="My balance">${ICON.coin}<b>${nf(p ? p.bal : 0)}</b></button>
      <button class="icon-btn" data-a="settings" aria-label="Settings">${ICON.gear}</button>
    </div>
  </header>`;
}

function tabBar() {
  const tabs = [["bets", "Bets", ICON.ticket], ["rank", "Standings", ICON.trophy], ["feed", "Feed", ICON.chat], ["me", "Me", ICON.user]];
  return `<nav class="tabbar" aria-label="Sections">${tabs.map(([k, l, i]) => `<button class="${S.view === "circle" && S.tab === k ? "on" : ""}" data-a="tab" data-v="${k}" ${S.view === "circle" && S.tab === k ? 'aria-current="page"' : ""}>${i}<span>${l}</span></button>`).join("")}</nav>`;
}

function asideCol(cc, a) {
  const me = myId(cc);
  const top = a.standings.slice(0, 6);
  const ev = feedEvents(cc, a, 8);
  return `<aside class="side">
    <div class="panel">
      <div class="row between"><h3>Standings</h3><button class="link" data-a="tab" data-v="rank">See all</button></div>
      <ol class="mini-rank">${top.map(s => `<li class="${s.uid === me ? "me" : ""}"><span class="rk">${s.rank}</span>${avatar(s, "sm")}<span class="grow">${esc(s.name)}</span><b>${nf(s.bal)}</b></li>`).join("")}</ol>
      ${cc.local ? "" : `<button class="btn small ghost wide" data-a="invite">${ICON.users} Invite friends</button>`}
    </div>
    <div class="panel">
      <div class="row between"><h3>Latest news</h3><button class="link" data-a="tab" data-v="feed">The feed</button></div>
      ${ev.length ? `<ul class="feed mini">${ev.map(e => feedItem(cc, e)).join("")}</ul>` : `<p class="muted">Nothing yet.</p>`}
    </div>
  </aside>`;
}

function render() {
  _renderTick++;
  _pendingLive = false;
  const app = $("#app");
  let main = "", header = "", tabbar = "", aside = "", fab = "";
  let view = S.view;
  const cc = DB.cur();
  if (view === "settings") main = settingsView();
  else if (view === "solo") main = soloView();
  else if (!S.code || view === "home") { view = "home"; main = homeView(); }
  else if (!cc || cc.status !== "ok" || !cc.circle) { view = "state"; main = circleStateView(cc); }
  else {
    const a = analysis(cc);
    updateSnap(cc, a);
    if (S.pendingMatch) setTimeout(processPendingMatch, 0);
    header = topBar(cc, a);
    tabbar = tabBar();
    aside = asideCol(cc, a);
    if (view === "bet") main = betView(cc, a);
    else if (view === "player") main = playerView(cc, a);
    else {
      view = "circle";
      main = S.tab === "rank" ? rankTab(cc, a) : S.tab === "feed" ? feedTab(cc, a) : S.tab === "me" ? meTab(cc, a) : betsTab(cc, a);
      if (S.tab === "bets") fab = `<button class="fab" data-a="newBet">${ICON.plus}<span>New bet</span></button>`;
    }
  }
  document.body.dataset.view = view;
  document.body.dataset.tab = S.tab;
  app.innerHTML = `${header}<div class="shell ${aside ? "has-side" : ""}"><main id="main">${main}</main>${aside}</div>${fab}${tabbar}`;
  renderModal();
}

let _lastModal = null;
function renderModal() {
  const ov = $("#overlay");
  const m = S.modal;
  if (!m) { ov.hidden = true; ov.innerHTML = ""; _lastModal = null; document.body.classList.remove("modal-open"); return; }
  const cc = DB.cur();
  const a = cc && cc.status === "ok" ? analysis(cc) : null;
  let html = "";
  switch (m.k) {
    case "account": html = Account.modal(); break;
    case "newCircle": html = newCircleModal(); break;
    case "join": html = joinModal(); break;
    case "invite": html = S.code ? inviteModal() : ""; break;
    case "switcher": html = switcherModal(); break;
    case "circle": html = cc && cc.circle ? circleModal() : ""; break;
    case "recover": html = recoverModal(); break;
    case "actor": html = actorModal(); break;
    case "newBet": html = a ? newBetModal(cc) : ""; break;
    case "wager": html = a ? wagerModal(cc, a) : ""; break;
    case "settle": html = a ? settleModal(cc, a) : ""; break;
    case "editProfile": html = editProfileModal(); break;
    case "feedback": html = feedbackModal(); break;
    case "legal": html = legalModal(); break;
    case "tour": html = tourModal(); break;
    case "ask": html = askModal(); break;
    case "install": html = installModal(); break;
    case "pickCircle": html = pickCircleModal(); break;
  }
  if (!html) { S.modal = null; return renderModal(); }
  ov.hidden = false;
  document.body.classList.add("modal-open");
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.k)}"><button class="sheet-x icon-btn" data-a="close" aria-label="Close">${ICON.x}</button>${html}</div>`;
  const key = m.k + (m.kind || "") + (m.mode || "") + (m.step || "");
  if (key !== _lastModal) {
    _lastModal = key;
    const f = ov.querySelector("input:not([type=radio]):not([type=checkbox]):not([type=hidden]), textarea");
    if (f && matchMedia("(pointer: fine)").matches) f.focus();
    else ov.querySelector(".sheet").focus({ preventScroll: true });
  }
}

/* Rendu « en direct » (données qui arrivent) sans casser une saisie en cours */
let _pendingLive = false;
function liveRender() {
  const el = document.activeElement;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== "radio" && el.type !== "checkbox" && el.type !== "file") { _pendingLive = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (_pendingLive) liveRender(); }, 50));

/* ---------- Confirmation (remplace confirm() du navigateur) ---------- */
function ask(msg, ok = "Confirm", danger = false) {
  return new Promise(res => {
    S.modal = { k: "ask", msg, ok, danger, res, prev: S.modal && S.modal.k !== "ask" ? S.modal : null };
    render();
  });
}
function askModal() {
  const m = S.modal;
  return `<div class="ask"><p class="ask-msg">${esc(m.msg)}</p>
    <div class="row end"><button class="btn ghost" data-a="askNo">Cancel</button><button class="btn ${m.danger ? "danger" : "primary"}" data-a="askYes">${esc(m.ok)}</button></div></div>`;
}
function askDone(v) {
  const m = S.modal;
  S.modal = m.prev;
  m.res(v);
}

/* ---------- Présentation ---------- */
const TOUR = [
  { e: "🪙", t: "Tokens, not money", d: "Every member gets tokens at the start of the season, plus a small bonus each day. They have no value: only glory counts." },
  { e: "📈", t: "Odds move on their own", d: "All stakes go into a pot shared by the winners. The fewer people on your pick, the more it pays." },
  { e: "🎟️", t: "Bet on anything", d: "Import football or NBA matches, ask a question about the office, an election, or challenge a friend to a duel." },
  { e: "🧑‍⚖️", t: "A fair result", d: "The bet's creator enters the result, or it arrives on its own for imported matches. If most bettors dispute it, winnings are frozen." },
];
function tourModal() {
  const i = S.modal.step || 0, s = TOUR[i];
  return `<div class="tour">
    <div class="tour-emo" aria-hidden="true">${s.e}</div>
    <h2>${s.t}</h2><p>${s.d}</p>
    <div class="dots" aria-hidden="true">${TOUR.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>
    <div class="row between">
      <button class="btn ghost" data-a="close">Skip</button>
      ${i < TOUR.length - 1 ? `<button class="btn primary" data-a="tourNext">Next</button>` : `<button class="btn primary" data-a="close">Got it</button>`}
    </div></div>`;
}

/* ---------- Actions ---------- */
function act(a, d) {
  switch (a) {
    case "close": if (S.modal && S.modal.k === "ask") { askDone(false); return true; } S.modal = null; return true;
    case "askYes": askDone(true); return true;
    case "askNo": askDone(false); return true;
    case "back": goBack(); return "keep";
    case "reload": location.reload(); return "keep";
    case "tab":
      S.tab = d.v;
      if (S.view !== "circle") { go("circle"); return "keep"; }
      window.scrollTo(0, 0);
      return true;
    case "tourNext": S.modal.step = (S.modal.step || 0) + 1; return true;
  }
  return circlesAct(a, d) || homeAct(a, d) || soloAct(a, d) || betsAct(a, d) || feedAct(a, d) || profileAct(a, d) || accountAct(a, d) || settingsAct(a, d);
}

document.addEventListener("click", e => {
  const ov = $("#overlay");
  if (e.target === ov) { if (S.modal && S.modal.k === "ask") askDone(false); else S.modal = null; render(); return; }
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  if (el.tagName === "A") e.preventDefault();
  const r = act(el.dataset.a, Object.assign({}, el.dataset));
  if (r === true) render();
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-f]");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f);
  const r = circlesSubmit(f, fd) || soloSubmit(f, fd) || betsSubmit(f, fd) || feedSubmit(f, fd) || profileSubmit(f, fd) || accountSubmit(f, fd) || (f.dataset.f === "feedback" && (sendFeedback(fd), true));
  if (r === true) render();
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.name === "amt" && t.closest('form[data-f="wager"]')) updatePotential();
  if (t.name === "slipStake") updateSlip();
  if (t.classList.contains("code-input")) {
    const v = t.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    t.value = v.length > 3 ? v.slice(0, 3) + "-" + v.slice(3) : v;
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.f === "league") { loadFixtures(t.value); return; }
  if (t.dataset.f === "import" && t.files && t.files[0]) { importData(t.files[0]); t.value = ""; return; }
  if (t.type === "checkbox" && t.name === "fx" && S.modal) S.modal.sel = $$('input[name="fx"]:checked').map(x => x.value);
  if (t.type === "radio") {
    const grp = t.closest(".emoji-grid, .choice-list, .segs");
    if (grp) $$("label", grp).forEach(l => l.classList.toggle("on", !!l.querySelector("input:checked")));
    if (t.name === "where" && S.modal) S.modal.where = t.value;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.modal) { if (S.modal.k === "ask") askDone(false); else S.modal = null; render(); }
});

/* ---------- Démarrage ---------- */
function boot() {
  Solo.load();
  applyTheme();
  FB.onAuth(() => Account.onAuth());
  FB.onAuth(() => {
    const cc = DB.cur();
    if (S.code && (!cc || !cc.local) && (!cc || cc.status !== "ok")) { const c = S.code; DB.close(); DB.open(c); }
    if (S.pendingJoin && Profile.get().name) { S.modal = { k: "join", code: S.pendingJoin }; S.pendingJoin = null; }
  });
  FB.init();

  const q = new URLSearchParams(location.search);
  const join = normCode(q.get("join"));
  if (join) {
    history.replaceState(null, "", location.pathname);
    if (MyCircles.has(join)) { S.code = join; S.view = "circle"; }
    else S.pendingJoin = join;
  }
  const last = Store.get("last");
  if (!S.code && last && MyCircles.has(last)) { S.code = last; S.view = "circle"; }
  if (S.code) DB.open(S.code);
  if (S.pendingJoin && FB.ready && FB.ok && Profile.get().name) { S.modal = { k: "join", code: S.pendingJoin }; S.pendingJoin = null; }
  if (!Store.get("tourDone") && Profile.get().name) { S.modal = S.modal || { k: "tour", step: 0 }; Store.set("tourDone", 1); }
  render();
  $("#splash") && $("#splash").remove();

  setInterval(() => { if (!S.modal) liveRender(); }, 30000);
  setInterval(() => Sports.autoSettle(), 60000);
  setInterval(() => { if (S.view === "solo" && S.soloView === "daily") Daily.refresh(); }, 120000);
  setTimeout(() => Sports.autoSettle(), 4000);

  // Service worker et mises à jour
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    let had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register(BASE + "sw.js", { scope: BASE }).catch(() => { });
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (had) $("#update").hidden = false;
      had = true;
    });
  }
}

boot();
</script>
</body>
</html>
